/* 类型标签权重:追踪/召唤/持续伤害等信息量更高的类型获得额外评价分 */
const TAG_W={ ranged:1.0, melee:0.5, buff:3.2, mobility:1.6, aoe:2.2, pierce:2.6,
              homing:3.4, multi:2.0, dot:3.0, summon:3.2, defense:3.4 };
/* 角色平衡度模型:属性分(血量/速度/回复/普攻 DPS)+ 技能分(伤害×倍率 + 功能 + 类型附加 / 冷却)
 * 输出综合战力 CPR;技能分内已含「冷却折算」,短 CD 技能因可更频繁施放而收益更高。 */
function balanceOf(ch){
  const wm=WEAPONS[ch.weapon]||WEAPONS.rifle;
  const mw=MELEE_WEP[ch.meleeW||'saber'];
  const baseRangedDPS=wm.dmg*ch.bullet/wm.cd;
  /* 近战武器各有取舍:用 DPS×射程修正折算成一维近战强度 */
  const meleeVal=mw.dmg*MELEE_DMG/mw.cd*(0.8+mw.range/200)*ch.atk*roleMeleeMul(ch);
  const hpScore=ch.hp;
  const speedScore=ch.spd*0.5+ch.jump*0.10+(ch.canFly?9:0);
  const regenScore=ch.regen*0.9;
  const atkScore=baseRangedDPS*6+meleeVal*2.4;
  let skillScore=0, rangedSkills=0, buffSkills=0;
  const detail=[];
  for(const slot of ['nJ','fJ','bJ','nK','fK','bK']){
    const id=ch.skills&&ch.skills[slot]; if(!id) continue;
    const r=SKILL_RATING[id]||{kind:'buff',util:4,tags:[]}, sk=SKILLS[id]||{cd:6};
    let dmg=0;
    if(r.kind==='ranged'||r.kind==='summon'){
      const w=(r.wep&&r.wep!=='main')?(WEAPONS[r.wep]||wm):wm;
      dmg=(r.n||1)*ch.bullet*w.dmg*(r.mul||1);
    }else if(r.kind==='melee'){ dmg=(r.n||1)*ch.atk*mw.dmg*MELEE_DMG*(r.mul||1)*roleMeleeMul(ch); }
    let tagBonus=0; for(const t of (r.tags||[])) tagBonus+=(TAG_W[t]||0);
    const raw=dmg+(r.util||0)*6+tagBonus*7;
    const eff=raw/Math.max(2.5,sk.cd);
    skillScore+=eff*14;
    const tl=r.tags||[];
    if(tl.some(t=>t==='ranged'||t==='homing'||t==='summon')) rangedSkills++;
    if(tl.some(t=>t==='buff'||t==='defense')) buffSkills++;
    detail.push({slot,id,dmg:Math.round(dmg),util:r.util||0,tags:tl,eff:+eff.toFixed(1)});
  }
  const cpr=Math.round(hpScore+speedScore+regenScore+atkScore+skillScore);
  return { cpr, hp:Math.round(hpScore), speed:Math.round(speedScore), regen:Math.round(regenScore),
           atk:Math.round(atkScore), skill:Math.round(skillScore), rangedSkills, buffSkills, detail };
}
/* 全角色平衡报表:以 8 台原生机体均值为基准,输出偏离度(隐藏机体目标高于均值) */
function balanceReport(){
  const rows=CHARS.map((c,i)=>Object.assign({i,name:c.name,tag:c.tag,locked:!!c.locked},balanceOf(c)));
  const base=rows.filter(r=>!r.locked);
  const mean=base.reduce((a,r)=>a+r.cpr,0)/Math.max(1,base.length);
  for(const r of rows) r.deviate=+(((r.cpr-mean)/mean)*100).toFixed(1);
  return {mean:Math.round(mean), rows};
}

}

 * 一条主线共 10 关:进入故事模式后先选定一名出击机师,再用该机师顺关卡推进。
 * 每关战场遍布普通杂兵,末段由一名 Boss 坐镇 —— Boss 是该出击机师的「影武者」镜像
 * (武装/技能/底盘数值完全复制,经统一系数换算,保证任何机师都打得过)。
 * 第 9 / 第 10 关的 Boss 分别是隐藏机体「天罚」与「湮灭」;击败后即解锁该机体,
 * 之后可在选人界面(双人 / 人机 / 故事)中选用。 */
const STORY_KEY='mechduel.story.v1';
let storyProg={cleared:0};                 // 已通关关卡数(顺序推进)
function loadStory(){
  try{ const s=localStorage.getItem(STORY_KEY); if(s){ const o=JSON.parse(s); if(o&&typeof o.cleared==='number') storyProg={cleared:o.cleared}; } }catch(e){}
}
function saveStory(){ try{ localStorage.setItem(STORY_KEY,JSON.stringify(storyProg)); }catch(e){} }
function storyLevelOpen(i){ return i===0 || storyProg.cleared>=i; }        // 第 i 关(0 基)是否已解锁
/* 隐藏机体解锁:通关数量达到该机体的 unlock 关卡数后解锁,可在选人界面选用。 */
function charUnlocked(i){ const c=CHARS[i]; return !c.locked || storyProg.cleared>=(c.unlock||0); }

/* 故事模式 Boss 平衡系数:
 * 影武者 = 本关机师的「镜像」:技能组完全复制本关机师(「你的影子」),
 * 但作为可攻略的 Boss,不能靠同伤害+高血量硬压。折中方案:
 *   hpK  — 血量倍率(略高于玩家,压迫感来源)
 *   dmgK — 输出倍率(略低于玩家,给玩家「换血占优」的窗口)
 *   sizeK— 体型倍率(同步放大受击面积与近战范围,过大则近战范围碾压)
 *   regen— 回复倍率 */
const STORY_BOSS={ hpK:1.15, dmgK:0.8, sizeK:1.35, regenK:1.0, bossWaveAdds:0 };
/* 波间补给:清剿一波后为机师纳米修复,避免「上一波残血 → 下一波必败」的连续消耗死局。
 * healK 为按最大血量回复的比例(0=不回复,1=回满)。 */
const WAVE_HEAL={ healK:0.9 };
/* Boss 一律是「玩家里所选出击机师」的镜像经同一组系数换算而来,保证 1~10 关强度换算规则一致。
 * 只镜像「武装/技能/底盘数值」,外观与命名取自隐藏机体(第 9/10 关)或通用影武者配色。
 * 这样出击机师强度与 Boss 强度天然挂钩,不会出现某关数学上必败、某关又必过的极端。 */
function bossChar(lv, heroIdx){
  const B=STORY_BOSS;
  const hero=CHARS[heroIdx!==undefined?heroIdx:0];           // 镜像来源:玩家所选出击机师
  const look=lv.bossIdx!==undefined?CHARS[lv.bossIdx]:null;  // 第 9/10 关的隐藏机体皮肤
  return {
    name:look?look.name:'影武者·'+hero.name, tag:'BOSS',
    pal:look?look.pal:{main:'#3a3f52',dark:'#20242f',light:'#8a93ad',joint:'#171b24',visor:'#ff3b5b',gun:'#2a2e3a',saber:'#ff6a7a'},
    hp:Math.round(hero.hp*B.hpK),
    spd:hero.spd, jump:hero.jump,
    atk:Math.round(hero.atk*100*B.dmgK)/100,
    bullet:Math.max(1,Math.round(hero.bullet*B.dmgK)),
    regen:Math.round(hero.regen*B.regenK),
    size:B.sizeK, weapon:hero.weapon, meleeW:hero.meleeW||'saber',
    canFly:!!hero.canFly, airW:hero.airW,
    skills:Object.assign({},hero.skills)       // 镜像:与玩家同款技能组
  };
}

/* ---------------- 2. 音效(WebAudio 方波/噪声,复古芯片音) ---------------- */
let AC = null, noiseBuf = null;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){}
}
function tone(type,f0,f1,dur,vol){
  if(!AC) return;
  const o=AC.createOscillator(), gn=AC.createGain(), t=AC.currentTime;
  o.type=type; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+dur);
}
function noise(dur,vol,f){
  if(!AC) return;
  const s=AC.createBufferSource(), gn=AC.createGain(), fl=AC.createBiquadFilter(), t=AC.currentTime;
  s.buffer=noiseBuf; fl.type='lowpass'; fl.frequency.setValueAtTime(f,t);
  fl.frequency.exponentialRampToValueAtTime(120,t+dur);
  gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(fl).connect(gn).connect(AC.destination); s.start(t); s.stop(t+dur);
}

const PREVENT = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);

};
addEventListener('keydown',e=>{
  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  if(PREVENT.has(e.code)) e.preventDefault();
  if(!e.repeat){
    pressed[e.code]=true;
    for(let i=1;i<=5;i++) if(e.key===String(i)) pressed['Digit'+i]=true;  // e.key 兜底(兼容部分自动化/布局)

/* 选人确认(P1 确定 → P2/AI;双方确定 → 选地图) */
function confirmSelect(){
  const S=game.select;
  if((S.phase==='p1'||S.phase==='p2')&&!charUnlocked(S.cursor)){ sfx.hit(); return; }
  sfx.ui();
  if(S.phase==='p1'){
    S.idx1=S.cursor;
    if(game.mode===1){ S.phase='cpuPick'; S.t=0.9; S.pickT=0; game.state='cpuPick'; }
    else if(game.mode===2){ game.startTraining(); }
    else S.phase='p2';
  }else if(S.phase==='p2'){
    S.idx2=S.cursor; S.cursor=0; S.phase='map'; game.state='map';
  }
}
/* 选图确认(第 5 项为随机)→ VS 过场 */
function confirmMap(){
  const S=game.select;
  game.mapIdx = S.cursor>=MAPS.length ? ri(0,MAPS.length-1) : S.cursor;
  S.phase='vs'; S.t=1.1; game.state='vs';
  sfx.ui();
}
/* 标题页/菜单点击开始(兼容触屏与自动化测试) */
cv.addEventListener('pointerdown',e=>{
  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(game.state==='title'){
    if(y>=110&&y<200){
      const i=clamp(Math.floor((y-110)/18),0,4);
      if(i===0) game.beginFlow(0);
      else if(i===1) game.beginFlow(1);
      else if(i===2) game.beginStory();
      else if(i===3) game.beginTraining();
      else game.beginSpectate();
    }
  }else if(game.state==='diff'){
    if(y>=100&&y<=200){ game.diffObj=DIFFS[clamp(Math.floor((y-100)/32),0,2)]; game.state='select'; sfx.ui(); }
  }else if(game.state==='select'){
    const S=game.select;
    if((S.phase==='p1'||S.phase==='p2')&&x>=14&&x<474&&y>=52&&y<224){
      S.cursor=clamp(Math.floor((y-52)/86),0,1)*5+clamp(Math.floor((x-14)/92),0,4);
      confirmSelect();
    }
  }else if(game.state==='map'){
    const S=game.select;
    if(x>=18&&x<470&&y>=94&&y<146){ S.cursor=clamp(Math.floor((x-18)/92),0,4); confirmMap(); }
  }else if(game.state==='storyChar'){
    if(x>=14&&x<474&&y>=52&&y<224){
      const i=clamp(Math.floor((y-52)/86),0,1)*5+clamp(Math.floor((x-14)/92),0,4);
      game.storyPick.cursor=i; game.confirmStoryHero(i);
    }
  }else if(game.state==='story'){
    if(x>=14&&x<474&&y>=52&&y<224){
      const i=clamp(Math.floor((y-52)/86),0,1)*5+clamp(Math.floor((x-14)/92),0,4);
      game.storySel.cursor=i; game.enterStoryLevel(i);
    }
  }else if(game.state==='scenario'){
    if(game.storyScenT>0.25) game.startStoryFight();
  }else if(game.state==='sresult'){
    if(game.storyResT>0.8) game.exitStory();
  }
});

function genWindows(w,h,density,ww,wh,sx,sy){
  const arr=[];
  for(let gx=sx;gx<w-ww;gx+=sx) for(let gy=sy;gy<h-wh;gy+=sy)

  return arr;
}

function fitCanvas(){
  const r=cv.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const s=Math.max(1,Math.floor(Math.max(480,Math.round(r.width*dpr))/480));
  cv.width=480*s; cv.height=270*s; SC=s;
  buildBackground();
}

/* ---------------- 5. 粒子与子弹 ---------------- */
let particles=[];
function sparks(x,y,col,n=6,spd=90){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), v=rnd(spd*0.3,spd);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:rnd(0.2,0.45),max:0.45,col,sz:ri(1,2),g:260});
  }
}
function explosion(x,y){
  for(let i=0;i<26;i++){
    const a=rnd(0,Math.PI*2), v=rnd(30,160);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rnd(0.3,0.8),max:0.8,
      col:['#ffd166','#ff8c42','#ff5b5b','#fff2c0'][ri(0,3)],sz:ri(1,3),g:180});
  }
  for(let i=0;i<10;i++)
    particles.push({x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-15,15),vy:rnd(-70,-20),life:rnd(0.5,1.1),max:1.1,col:'#5a5f6e',sz:ri(2,3),g:-30});
}
/* 命中特效:火花四溅 + 被弹开的碎屑(反弹感) */
function impactFX(x,y,dir=1,col='#ffd166',n=7){
  dir=Math.sign(dir)||1;
  sparks(x,y,col,n,115);
  sparks(x,y,'#ffffff',Math.max(2,n-3),85);
  for(let i=0;i<4;i++){                       // 弹开的碎屑:朝来向回弹
    const a=rnd(-0.9,0.9);
    particles.push({ x,y, vx:-dir*Math.cos(a)*rnd(45,115), vy:Math.sin(a)*rnd(30,90)-30,
      life:rnd(0.18,0.36), max:0.36, col:i%2?'#fff2c0':col, sz:ri(1,2), g:180 });
  }
}
function updateParticles(dt){
  for(const p of particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; }
  particles=particles.filter(p=>p.life>0 && p.y<H+8);
}
function drawParticles(){
  for(const p of particles){
    g.globalAlpha=clamp(p.life/p.max,0,1);
    px(Math.round(p.x),Math.round(p.y),p.sz,p.sz,p.col);
  }
  g.globalAlpha=1;
}
let bullets=[];
let fireZones=[];        // 凝固燃烧弹留下的持续火海({x,team,own,r,t,max,tick,dmg})
let drones=[];           // 浮游炮单位({x,y,team,own,t,cd,hover,dmg})
let covers=[];           // 部署掩体({x,y,team,own,hp,max,t,w,h})
let iceballs=[];         // 寒冰球({x,y,vx,team,own,r,hp,t,dmg})
let emorbs=[];           // 电磁球({x,y,vx,vy,team,own,r,hp,t,dmg,ph})
let lightnings=[];       // 雷击锁定({own,team,tgt,t,gap,dmg})
/* 火箭弹爆炸:范围伤害 + 强击退 + 火花 */
function explodeBullet(b,mechs){
  if(b.exploded) return; b.exploded=true; b.dead=true;
  sfx.boom();
  for(let i=0;i<14;i++)
    particles.push({x:b.x,y:b.y,vx:rnd(-90,90),vy:rnd(-110,30),life:rnd(0.25,0.55),max:0.55,col:i%3?'#ff9a4d':'#ffe27a',sz:ri(2,3),g:220});
  game.shake=Math.max(game.shake,4);
  if(b.type==='incendiary'){                 // 燃烧弹:落点留下持续灼烧的火海
    fireZones.push({ x:b.x, team:b.team, own:b.own, r:44, t:3.0, max:3.0,
      tick:0, dmg:Math.max(1,Math.round((b.dmg||10)*0.16)) });
  }
  for(const m of mechs){
    if(m.team===b.team||m.dead) continue;
    const dx=m.x-b.x, dy=(m.y-20*m.size)-b.y;
    if(Math.hypot(dx,dy)<(b.aoe||0)*(b.sc||1)+10*m.size){   // 放大弹体:爆炸范围同步放大
      hitMech(m,b.dmg,Math.sign(dx)||Math.sign(b.vx)||1,false);
      m.vx+=(Math.sign(dx)||1)*b.knock; m.vy=Math.min(m.vy,-60);
    }
  }
}
function updateBullets(dt,mechs){
  for(const b of bullets){
    b.t+=dt;
    b.x+=b.vx*dt;
    if(b.wave!==undefined) b.y=b.baseY+Math.sin(b.t*18)*7;   // 电弧波浪轨迹
    else b.y+=b.vy*dt;
    if(b.turn){                                   // 追踪弹:持续朝目标修正航向
      const tgt=mechs.find(m2=>m2.team!==b.team&&!m2.dead&&m2.cloakT<=0);
      if(tgt){
        const want=Math.atan2((tgt.y-20*tgt.size)-b.y,tgt.x-b.x);
        let cur=Math.atan2(b.vy,b.vx), diff=want-cur;
        while(diff>Math.PI) diff-=2*Math.PI; while(diff<-Math.PI) diff+=2*Math.PI;
        const mt=b.turn*dt; cur+=clamp(diff,-mt,mt);
        b.vx=Math.cos(cur)*b.spd; b.vy=Math.sin(cur)*b.spd; b.ang=cur;
      }
      if(Math.random()<0.7) particles.push({x:b.x,y:b.y,vx:rnd(-10,10),vy:rnd(-10,10),life:0.22,max:0.22,col:b.type==='homing'?'#7df9ff':'#ff9a4d',sz:ri(1,2),g:0});
      if(b.t>b.maxT){ if(b.aoe) explodeBullet(b,mechs); else b.dead=true; continue; }
    }
    if(b.type==='mortar'||b.type==='incendiary'){  // 迫击炮/燃烧弹:抛物线弹道,到点即炸
      b.vy+=b.grav*dt; b.ang=Math.atan2(b.vy,b.vx);
      if(Math.random()<0.5) particles.push({x:b.x,y:b.y,vx:rnd(-8,8),vy:rnd(-8,8),life:0.2,max:0.2,col:b.type==='incendiary'?'#ff9a4d':'#8a94a8',sz:1,g:0});
      if(b.y>=Math.min(b.ty,GROUND-2)||b.t>1.6){ explodeBullet(b,mechs); continue; }
    }
    if(b.type==='droneLaser'&&b.y>=GROUND-1){     // 浮游炮贯穿弹:触地消散
      sparks(b.x,GROUND,'#7de3ff',5,90); b.dead=true; continue;
    }
    if(b.type==='rocket'&&Math.random()<0.6)                 // 火箭尾焰
      particles.push({x:b.x-Math.cos(b.ang)*6,y:b.y-Math.sin(b.ang)*6,vx:rnd(-12,12),vy:rnd(-12,12),life:rnd(0.15,0.3),max:0.3,col:'#ff9a4d',sz:ri(1,2),g:0});
    // —— 光束/电弧弹拖尾粒子:让高速弹道留下能量尾迹 ——
    if((b.type==='laser'||b.type==='droneLaser'||b.type==='droneShot')&&Math.random()<0.55)
      particles.push({x:b.x,y:b.y,vx:rnd(-10,10),vy:rnd(-10,10),life:0.16,max:0.16,col:b.type==='laser'?'#5ff2ff':'#7df9ff',sz:1,g:0});
    if(b.type==='arc'&&Math.random()<0.5)
      particles.push({x:b.x,y:b.y,vx:rnd(-22,22),vy:rnd(-22,22),life:0.14,max:0.14,col:'#64f0c8',sz:1,g:0});
    if(b.type==='rocket'&&b.y>=GROUND-1){ explodeBullet(b,mechs); continue; }  // 撞地爆炸
    // —— 冰球拦截:寒冰球可挡下敌方的飞行道具 ——
    if(!b.aoe&&b.type!=='droneLaser'){          // 范围弹/贯穿激光不被冰球拦下
      let blocked=false;
      for(const ib of iceballs){
        if(ib.team===b.team) continue;
        if(Math.hypot(b.x-ib.x,b.y-ib.y)<ib.r+3){
          ib.hp-=8; impactFX(b.x,b.y,b.vx,'#eafffa',7);
          b.dead=true; blocked=true;
          if(ib.hp<=0){ ib.t=0; sparks(ib.x,ib.y,'#bfeaff',14,120); }
          break;
        }
      }
      if(blocked) continue;
    }
    // —— 电磁球拦截:电磁球可挡下敌方的子弹与飞弹(范围弹伤害球体更多) ——
    if(!b.pierce&&b.type!=='droneLaser'){
      let blocked=false;
      for(const eb of emorbs){
        if(eb.team===b.team) continue;
        if(Math.hypot(b.x-eb.x,b.y-eb.y)<eb.r+4){
          eb.hp-=(b.aoe?22:9); impactFX(b.x,b.y,b.vx,'#b18cff',8);
          b.dead=true; blocked=true;
          if(eb.hp<=0){ eb.t=0; sparks(eb.x,eb.y,'#e0d0ff',14,130); }
          break;
        }
      }
      if(blocked) continue;
    }
    // —— 掩体拦截:掩体只挡下敌方的普通弹药 ——
    if(!b.aoe){
      let blocked=false;
      for(const cp of covers){
        if(cp.team===b.team) continue;
        if(b.x>cp.x-cp.w/2-2&&b.x<cp.x+cp.w/2+2&&b.y>GROUND-cp.h-2&&b.y<GROUND+2){
          cp.hp-=b.dmg||BULLET_DMG; impactFX(b.x,b.y,b.vx,'#9adcff',7);
          b.dead=true; blocked=true;
          break;
        }
      }
      if(blocked) continue;
    }
    for(const m of mechs){
      if(m.team===b.team||m.dead) continue;
      if(b.hitSet&&b.hitSet.has(m.id)) continue;             // 光束已穿透过该机
      if(Math.abs(b.x-m.x)<11*m.size+(b.r||0) && b.y>m.y-40*m.size && b.y<m.y-2){
        if(b.aoe){ explodeBullet(b,mechs); break; }
        impactFX(b.x,b.y,b.vx,'#ffd166',6);
        hitMech(m,b.dmg||BULLET_DMG,Math.sign(b.vx)||1,false);
        if(b.knock>60) m.vx+=(Math.sign(b.vx)||1)*b.knock*0.4;
        if(b.pierce){ (b.hitSet=b.hitSet||new Set()).add(m.id); }
        else b.dead=true;
        break;
      }
    }
    if(b.x<-12||b.x>W+12||b.y<-60||b.y>H+40) b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead);
}
function drawBullets(){
  for(const b of bullets){
    const x=Math.round(b.x), y=Math.round(b.y);
    const sc=b.sc||1;
    if(sc!==1){ g.save(); g.translate(x,y); g.scale(sc,sc); g.translate(-x,-y); }   // 隐藏机体:放大弹体
    if(b.type==='rocket'){
      g.save(); g.translate(x,y); g.rotate(b.ang);
      px(-5,-2,8,4,'#8a8f9a'); px(1,-1,3,2,'#ffb84d'); px(-7,-1,2,2,'#ff5a3c');
      g.restore();
    }else if(b.type==='laser'){
      g.save(); g.translate(x,y); g.rotate(b.ang);
      g.globalAlpha=0.4; px(-9,-1,18,3,'#5ff2ff'); g.globalAlpha=1;
      px(-9,0,18,1,'#ffffff');
      g.restore();
    }else if(b.type==='arc'){
      g.globalAlpha=0.5; px(x-2,y-2,4,4,'#64f0c8'); g.globalAlpha=1;
      px(x-1,y-1,2,2,'#eafffa');
    }else if(b.type==='homing'||b.type==='seeker'){
      g.save(); g.translate(x,y); g.rotate(b.ang);
      if(b.type==='homing'){ px(-4,-1,7,2,'#cfd6ea'); px(3,-1,2,2,'#7df9ff'); px(-6,0,2,1,'#ff9a4d'); }
      else{ px(-6,-2,10,4,'#3f4a5f'); px(4,-2,3,4,'#64f0c8'); px(-8,-1,2,2,'#ff5a3c'); }
      g.restore();
    }else if(b.type==='hellfire'){                           // 地狱火导弹:带焰尾的弧线追踪弹
      g.save(); g.translate(x,y); g.rotate(b.ang);
      g.globalAlpha=0.5; px(-8,-2,10,4,'#ff5b1b'); g.globalAlpha=1;
      px(-5,-2,7,4,'#8a8f9a'); px(1,-1,3,2,'#ffb84d'); px(-6,-1,3,2,'#ff3b1b');
      g.restore();
    }else if(b.type==='incendiary'){                         // 燃烧弹:咕嘟冒泡的橙色弹体
      g.save(); g.translate(x,y); g.rotate(b.ang*0.5);
      pixelCircle(0,0,4,'#5a3a20'); px(-3,-2,6,4,'#ff8c2a'); px(-2,-1,4,2,'#ffe27a');
      g.restore();
    }else if(b.type==='droneLaser'){                         // 浮游炮贯穿激光
      g.save(); g.translate(x,y);
      g.globalAlpha=0.4; px(-2,-20,4,40,'#7de3ff'); g.globalAlpha=1;
      px(-1,-20,2,40,'#eafffa');
      g.restore();
    }else if(b.type==='mortar'){
      g.save(); g.translate(x,y); g.rotate(b.ang*0.5);
      pixelCircle(0,0,3,'#5a6470'); px(-4,-1,2,2,'#3a3f4a'); px(2,-1,2,2,'#8a94a8');
      g.restore();
    }else if(b.type==='droneShot'){                          // 三连装浮游炮:短小青色点射弹
      g.save(); g.translate(x,y); g.rotate(b.ang);
      g.globalAlpha=0.4; px(-6,-1,8,2,'#7df9ff'); g.globalAlpha=1;
      px(-3,-1,5,2,'#bff6ff'); px(0,-1,2,2,'#ffffff');
      g.restore();
    }else{                                                   // rifle/vulcan/spread 通用弹丸
      const dir=Math.sign(b.vx)||1;
      g.globalAlpha=0.35; px(x-dir*5,y,4,1,'#ffb84d');
      g.globalAlpha=1;
      px(x-2,y-1,5,3,'#ffb84d');
      px(x-1,y,3,1,'#fff6d8');
    }
    if(sc!==1) g.restore();
  }
}

/* 凝固燃烧弹火海:持续 tick 灼烧范围内的敌对单位 + 火焰粒子 */
function updateFireZones(dt,mechs){
  for(const fz of fireZones){
    fz.t-=dt; fz.tick-=dt;
    if(fz.tick<=0){                            // 每 0.4s 对范围内单位结算一次灼烧
      fz.tick=0.4;
      for(const m of mechs){
        if(m.team===fz.team||m.dead) continue;
        if(Math.abs(m.x-fz.x)<fz.r*0.5 && Math.abs(m.y-GROUND)<46)
          hitMech(m,fz.dmg,(Math.sign(m.x-fz.x)||1)*18,false);
      }
    }
    if(Math.random()<0.7) particles.push({ x:fz.x+rnd(-fz.r*0.4,fz.r*0.4), y:GROUND-rnd(0,8),
      vx:rnd(-10,10), vy:rnd(-46,-16), life:rnd(0.3,0.6), max:0.6,
      col:['#ff8c2a','#ffd166','#ff5b1b'][ri(0,2)], sz:ri(1,2), g:-20 });
  }
  fireZones=fireZones.filter(fz=>fz.t>0);
}
function drawFireZones(){
  for(const fz of fireZones){
    const life=clamp(fz.t/fz.max,0,1), r=fz.r;
    g.globalAlpha=0.5*life; px(fz.x-r/2,GROUND-3,r,4,'#3a1408'); g.globalAlpha=1;   // 焦痕
    for(let i=0;i<8;i++){                                                          // 舞动火舌
      const fx=fz.x-r/2+(i+0.5)*(r/8)+Math.sin(T*9+i*2+fz.x)*1.5;
      const h=((i%3)*6+11)*(0.55+0.45*Math.sin(T*13+i))*life+3;
      g.globalAlpha=0.85*life; px(fx-2,GROUND-h,4,h,(i%2)?'#ff8c2a':'#ffd166');
      g.globalAlpha=0.6*life;  px(fx-1,GROUND-h-3,2,4,'#fff2c0');
    }
    g.globalAlpha=0.4*life; px(fz.x-r/2,GROUND-1,r,1,'#ff5b1b'); g.globalAlpha=1;  // 范围提示
  }
}
/* 浮游炮:自主飞至最近敌人正上方,周期性向下发射贯穿激光
 * 修复无人机(kind='heal'):跟随己方施放者,周期性为其充能回血 */
function updateDrones(dt,mechs){
  for(const d of drones){
    d.t-=dt; d.cd-=dt; d.hover+=dt*3;
    if(d.kind==='heal'){                       // —— 修复无人机 ——
      const owner=mechs.find(m=>m.id===d.own);
      if(owner&&!owner.dead){
        const tx=owner.x-owner.facing*26, ty=owner.y-54*owner.size;
        d.x+=(tx-d.x)*Math.min(1,dt*5); d.y+=(ty-d.y)*Math.min(1,dt*5)+Math.sin(d.hover)*0.4;
        if(d.cd<=0){ d.cd=1;                     // 每 1s 治疗一次
          if(owner.hp<owner.maxHp){
            const hl=Math.min(d.heal,owner.maxHp-owner.hp);
            owner.hp+=hl;
            dmgTexts.push({x:owner.x+rnd(-6,6),y:owner.y-44*owner.size,val:'+'+hl,col:'#8fffc0',life:0.7,max:0.7});
            sparks(owner.x,owner.y-24*owner.size,'#8fffc0',7,60);
          }
        }
      }else{ d.t=Math.min(d.t,0); }              // 施放者阵亡:无人机消散
      if(Math.random()<0.5) particles.push({x:d.x+rnd(-6,6),y:d.y+rnd(-4,4),vx:rnd(-6,6),vy:rnd(-6,6),life:0.25,max:0.25,col:'#8fffc0',sz:1,g:0});
      continue;
    }
    if(d.kind==='tri'){                        // —— 三连装浮游炮:3 连发点射,每轮随机 1~2s 冷却 ——
      let tgt=null,bd=1e9;
      for(const m of mechs){ if(m.team===d.team||m.dead) continue; const dd=Math.abs(m.x-d.x); if(dd<bd){bd=dd;tgt=m;} }
      if(tgt){
        const tx=tgt.x+(d.off||0), ty=tgt.y-70+(d.offY||0);
        let vx=(tx-d.x)*3.2, vy=(ty-d.y)*3.2;
        const sp=280, mag=Math.hypot(vx,vy)||1;
        if(mag>sp){ vx=vx/mag*sp; vy=vy/mag*sp; }
        d.x+=vx*dt; d.y+=vy*dt+Math.sin(d.hover)*0.5;
        const ready=Math.abs(d.x-tx)<34 && d.y<ty+40;
        if(d.burst>0){                           // 点射进行中
          d.burstT-=dt;
          if(d.burstT<=0){
            d.burst--; d.burstT=0.09;
            if(ready){
              const ang=Math.atan2((tgt.y-18*tgt.size)-d.y,tgt.x-d.x);
              bullets.push({ x:d.x, y:d.y+5, vx:Math.cos(ang)*540, vy:Math.sin(ang)*540,
                own:d.own, team:d.team, dmg:d.dmg, type:'droneShot', t:0, ang, knock:22, hitSet:null,
                sc:d.sz||1, r:((d.sz||1)-1)*6 });
              sparks(d.x,d.y+6,'#7df9ff',2,60); sfx.shoot();
            }
            if(d.burst<=0) d.cd=rnd(1,2);        // 每轮点射结束:随机 1~2 秒冷却
          }
        }else if(ready && d.cd<=0){ d.burst=3; d.burstT=0; }
      }
      if(Math.random()<0.5) particles.push({x:d.x+rnd(-5,5),y:d.y+rnd(-4,4),vx:rnd(-6,6),vy:rnd(-6,6),life:0.25,max:0.25,col:'#7df9ff',sz:1,g:0});
      continue;
    }
    let tgt=null,bd=1e9;
    for(const m of mechs){ if(m.team===d.team||m.dead) continue; const dd=Math.abs(m.x-d.x); if(dd<bd){bd=dd;tgt=m;} }
    if(tgt){
      const tx=tgt.x, ty=tgt.y-74;                        // 目标正上方
      let vx=(tx-d.x)*3.4, vy=(ty-d.y)*3.2;
      const sp=300, mag=Math.hypot(vx,vy)||1;
      if(mag>sp){ vx=vx/mag*sp; vy=vy/mag*sp; }
      d.x+=vx*dt; d.y+=vy*dt+Math.sin(d.hover)*0.4;
      if(d.cd<=0 && Math.abs(d.x-tx)<28 && d.y<ty+34){    // 已就位:向下贯穿射击
        d.cd=0.6; d.ang=Math.PI/2;
        bullets.push({ x:d.x, y:d.y+7, vx:0, vy:540, own:d.own, team:d.team,
          dmg:d.dmg, type:'droneLaser', pierce:true, t:0, ang:Math.PI/2, knock:26, hitSet:null,
          sc:d.sz||1, r:((d.sz||1)-1)*6 });
        sfx.shoot();
      }
    }
    if(Math.random()<0.5) particles.push({x:d.x+rnd(-6,6),y:d.y+rnd(-4,4),vx:rnd(-6,6),vy:rnd(-6,6),life:0.25,max:0.25,col:'#7de3ff',sz:1,g:0});
  }
  drones=drones.filter(d=>d.t>0);
}
function drawDrones(){
  for(const d of drones){
    const x=Math.round(d.x), y=Math.round(d.y);
    const bob=Math.round(Math.sin(d.hover)*1);
    const fade=clamp(d.t/0.6,0,1);                       // 消散淡出
    g.globalAlpha=fade;
    if(d.kind==='heal'){                                 // —— 修复无人机(绿白配色) ——
      g.globalAlpha=fade*(0.35+0.2*Math.sin(T*10));      // 悬浮光环
      px(x-7,y+2+bob,14,5,'#1f4d38'); g.globalAlpha=fade;
      px(x-6,y-3+bob,12,6,'#e8fff2');                    // 壳体
      px(x-4,y-2+bob,8,3,'#8fffc0');
      px(x-2,y-1+bob,4,2,'#ffffff');                     // 指示灯
      px(x-1,y+3+bob,2,3,'#7dffb0');
      const blink=0.5+0.5*Math.sin(T*16);                // 治疗脉冲环
      g.globalAlpha=fade*blink;
      px(x-9,y-1+bob,3,3,'#8fffc0'); px(x+6,y-1+bob,3,3,'#8fffc0');
      g.globalAlpha=1; continue;
    }
    if(d.kind==='tri'){                                  // —— 三连装浮游炮(青蓝配色) ——
      g.globalAlpha=fade*(0.35+0.2*Math.sin(T*10));
      px(x-7,y-3+bob,14,8,'#1f3a4d'); g.globalAlpha=fade;
      px(x-6,y-2+bob,12,6,'#2f5a7a');                    // 壳体
      px(x-3,y-1+bob,6,3,'#7df9ff');                     // 核心
      px(x-2,y+4+bob,4,3,'#2a3a4d');                     // 炮口
      const rdy = d.burst>0;
      g.globalAlpha=fade*(rdy?0.9:0.4+0.4*Math.sin(T*16));
      px(x-8,y+bob,3,2,'#7df9ff'); px(x+5,y+bob,3,2,'#7df9ff');  // 侧翼炮
      px(x-1,y+7+bob,2,rdy?4:2,'#eafffa');               // 发射蓄能
      g.globalAlpha=1; continue;
    }
    g.globalAlpha=fade*(0.35+0.2*Math.sin(T*10));        // 悬浮光环
    px(x-9,y-4+bob,18,9,'#2a3a4d'); g.globalAlpha=fade;
    px(x-7,y-3+bob,14,7,'#3f566e');                      // 壳体
    px(x-3,y-2+bob,6,3,'#7de3ff');                       // 核心
    px(x-2,y+3+bob,4,5,'#39424f');                       // 炮口
    g.globalAlpha=fade*(0.5+0.5*Math.sin(T*16));
    px(x-1,y+7+bob,2,3,'#eafffa');                       // 发射蓄能
    g.globalAlpha=1;
  }
}
/* 部署掩体:固定 HP 的合金墙,只拦截来袭的敌方弹药,不阻挡自己人 */
function updateCovers(dt,mechs){

}

/* 寒冰球:缓慢前飞,阻挡敌方飞行道具,并对接触的敌人造成伤害与减速 */
function updateIceballs(dt,mechs){
  for(const ib of iceballs){
    ib.t-=dt; ib.x+=ib.vx*dt; ib.y+=ib.vy*dt;
    if(ib.x<8||ib.x>W-8) ib.vx*=-1;                       // 撞边反弹
    if(Math.random()<0.7) particles.push({x:ib.x+rnd(-ib.r,ib.r),y:ib.y+rnd(-ib.r,ib.r),
      vx:rnd(-8,8),vy:rnd(-14,-2),life:0.3,max:0.3,col:(ri(0,1)?'#bfeaff':'#eafffa'),sz:1,g:6});
    for(const m of mechs){                                 // 接触伤害(每球每目标 0.6s 一次)
      if(m.team===ib.team||m.dead) continue;
      ib.hitSet=ib.hitSet||new Set();
      if(ib.hitSet.has(m.id)) continue;
      if(Math.abs(m.x-ib.x)<ib.r+11*m.size && ib.y>m.y-40*m.size && ib.y<m.y-2){
        hitMech(m,ib.dmg,Math.sign(ib.vx)||1,false);
        m.slowT=Math.max(m.slowT||0,1.2);                  // 冻结减速
        ib.hitSet.add(m.id);
        sparks(m.x,m.y-22,'#bfeaff',10,90);
        ib.hp-=12;                                         // 撞击受损
        if(ib.hp<=0){ ib.t=0; sparks(ib.x,ib.y,'#eafffa',14,110); }
      }
    }
    // 每 0.6s 重置命中记录,使持续接触可反复生效
    ib.reSet=ib.reSet||0; ib.reSet-=dt;
    if(ib.reSet<=0){ ib.reSet=0.6; ib.hitSet=null; }
  }
  iceballs=iceballs.filter(ib=>ib.t>0&&ib.hp>0);
}
function drawIceballs(){
  for(const ib of iceballs){
    const x=Math.round(ib.x), y=Math.round(ib.y), r=ib.r;
    const fade=clamp(ib.t/0.6,0,1);
    g.globalAlpha=fade*0.35; pixelCircle(x,y,r+3,'#7fd8ff'); g.globalAlpha=fade;
    pixelCircle(x,y,r,'#bfeaff');
    pixelCircle(x,y,r-4,'#eafffa');
    // 冰晶棱面
    px(x-r+3,y-1,3,3,'#ffffff'); px(x+r-6,y+1,3,3,'#8fd8ff');
    px(x-1,y-r+3,3,3,'#ffffff'); px(x+1,y+r-6,3,3,'#8fd8ff');
    g.globalAlpha=1;
  }
}
/* 电磁球:向前缓慢漂浮,拦截敌方弹药,并对接触的敌人施加磁力干扰减速 */
function updateEmorbs(dt,mechs){
  for(const eb of emorbs){
    eb.t-=dt;
    eb.x+=eb.vx*dt;
    eb.ph=(eb.ph||0)+dt*6;
    eb.y+=Math.sin(eb.ph)*7*dt;                           // 上下轻微漂浮
    if(Math.random()<0.8) particles.push({x:eb.x+rnd(-eb.r,eb.r),y:eb.y+rnd(-eb.r,eb.r),
      vx:rnd(-12,12),vy:rnd(-16,4),life:0.32,max:0.32,col:ri(0,1)?'#b18cff':'#7df9ff',sz:1,g:0});
    for(const m of mechs){                                // 接触:磁力干扰(减速为主)
      if(m.team===eb.team||m.dead) continue;
      eb.hitSet=eb.hitSet||new Set();
      if(eb.hitSet.has(m.id)) continue;
      if(Math.abs(m.x-eb.x)<eb.r+11*m.size && eb.y>m.y-40*m.size && eb.y<m.y-2){
        m.slowT=Math.max(m.slowT||0,1.6);                 // 磁力干扰:降低移速
        if(eb.dmg>0) hitMech(m,eb.dmg,Math.sign(eb.vx)||1,false);
        eb.hitSet.add(m.id);
        sparks(m.x,m.y-22,'#b18cff',10,90);
        eb.hp-=10;                                        // 干扰消耗球体
        if(eb.hp<=0){ eb.t=0; sparks(eb.x,eb.y,'#e0d0ff',14,120); }
      }
    }
    // 每 0.7s 重置命中记录,使持续接触可反复生效
    eb.reSet=eb.reSet||0; eb.reSet-=dt;
    if(eb.reSet<=0){ eb.reSet=0.7; eb.hitSet=null; }
  }
  emorbs=emorbs.filter(eb=>eb.t>0&&eb.hp>0);
}
function drawEmorbs(){
  for(const eb of emorbs){
    const x=Math.round(eb.x), y=Math.round(eb.y), r=eb.r;
    const fade=clamp(eb.t/0.6,0,1)*clamp(eb.hp/12,0.3,1);
    g.globalAlpha=fade*0.35; pixelCircle(x,y,r+3,'#7df9ff'); g.globalAlpha=fade;
    pixelCircle(x,y,r,'#b18cff');
    pixelCircle(x,y,r-4,'#e6dbff');
    // 内部电极 + 环绕电弧
    px(x-1,y-1,2,2,'#ffffff');
    const a1=Math.round(Math.cos(eb.ph||0)*(r-2)), b1=Math.round(Math.sin(eb.ph||0)*(r-2));
    px(x+a1,y+b1,2,2,'#7df9ff'); px(x-a1,y-b1,2,2,'#7df9ff');
    g.globalAlpha=1;
  }
}
/* 雷击锁定:锁定最近的敌人,持续 3 秒、每 0.2s 落下一道闪电(1 秒 5 次) */
function updateLightnings(dt,mechs){
  for(const lt of lightnings){
    lt.t-=dt;
    const tgt=mechs.find(m=>m.id===lt.tgt&&!m.dead);
    if(!tgt){ lt.t=0; continue; }
    lt.x=tgt.x; lt.y=tgt.y-22*tgt.size;
    lt.gap-=dt;
    if(lt.gap<=0){
      lt.gap=0.2;
      hitMech(tgt,lt.dmg,0,false,true);                      // 持续伤害:不硬直
      sparks(lt.x,lt.y-40,'#c9a6ff',6,120);
    }
    if(Math.random()<0.6) particles.push({x:lt.x+rnd(-8,8),y:lt.y+rnd(-30,10),
      vx:rnd(-10,10),vy:rnd(-10,10),life:0.2,max:0.2,col:'#c9a6ff',sz:1,g:0});
  }
  lightnings=lightnings.filter(lt=>lt.t>0);
}
function drawLightnings(){
  for(const lt of lightnings){
    const x=Math.round(lt.x), yTop=Math.round(lt.y-120), yBot=Math.round(lt.y);
    g.globalAlpha=0.55;
    // 折线闪电主干:分段抖动
    for(let s=0;s<6;s++){
      const t0=s/6,t1=(s+1)/6;
      const y0=yTop+(yBot-yTop)*t0, y1=yTop+(yBot-yTop)*t1;
      const jx=Math.sin(T*40+s*3+lt.own)*4;
      px(x+jx-1,y0,3,y1-y0,'#c9a6ff');
    }
    g.globalAlpha=0.9;
    for(let s=0;s<6;s++){
      const t0=s/6,t1=(s+1)/6;
      const y0=yTop+(yBot-yTop)*t0, y1=yTop+(yBot-yTop)*t1;
      const jx=Math.sin(T*40+s*3+lt.own)*4;
      px(x+jx,y0,1,y1-y0,'#f0e6ff');
    }
    g.globalAlpha=1;
    px(x-2,yBot-1,5,2,'#eafffa');                          // 落点
  }
}
/* 飞行锁敌:±55° 锥内自动瞄准;隐身目标不可锁 */
function lockAngle(m,opp){
  const base=m.facing>0?0:Math.PI;
  if(!opp||opp.dead||opp.cloakT>0) return base;
  const dx=opp.x-m.x, dy=(opp.y-20*opp.size)-(m.y-24*m.size);
  if(Math.abs(dx)>8&&Math.sign(dx)!==m.facing) return base;   // 目标在背后不锁
  let diff=Math.atan2(dy,dx)-base;
  while(diff>Math.PI) diff-=2*Math.PI;
  while(diff<-Math.PI) diff+=2*Math.PI;
  return base+clamp(diff,-0.96,0.96);
}

/* 伤害数字:命中反馈,漂浮于受击者头顶 */
let dmgTexts=[];
function updateDmgTexts(dt){ for(const d of dmgTexts){ d.life-=dt; d.y-=34*dt; } dmgTexts=dmgTexts.filter(d=>d.life>0); }
function drawDmgTexts(){
  for(const d of dmgTexts){
    const sz=d.sz||9, life=clamp(d.life/d.max,0,1);
    const bx=Math.round(d.x), by=Math.round(d.y);
    if(d.glow){                                   // 高伤:闪光光晕
      g.globalAlpha=life*(0.25+0.35*Math.abs(Math.sin(T*11)));
      text(String(d.val),bx,by,sz+5,d.col,'center');
    }
    g.globalAlpha=life;
    text(String(d.val),bx+1,by+1,sz,'rgba(0,0,0,.8)','center');
    text(String(d.val),bx,by,sz,d.col,'center');
    if(d.glow){                                   // 高伤:白芯闪烁
      g.globalAlpha=life*(0.45+0.45*Math.abs(Math.sin(T*14)));
      text(String(d.val),bx,by,sz,'#ffffff','center');
    }
  }
  g.globalAlpha=1;
}

/* 地图专属危险:周期性 预警→爆发 的区域伤害
 * 夜幕都市=电网浪涌(闪电柱,全域高度) / 荒漠遗址=流沙旋风(横向移动扫过)
 * 冰原哨站=冰锥坠落(天降冰锥,落点溅射) / 熔岩工厂=岩浆喷泉(地面喷发) */
const HAZ_INFO=[
  {name:'电网浪涌', col:'#7de3ff', warn:1.0, live:0.55, dmg:9,  tmin:5.5, tmax:9.5},
  {name:'流沙旋风', col:'#e8c07a', warn:0.8, live:2.8,  dmg:8,  tmin:6.0, tmax:10.0},
  {name:'冰锥坠落', col:'#bfe8ff', warn:1.0, live:0.5,  dmg:10, tmin:5.5, tmax:9.5},
  {name:'岩浆喷泉', col:'#ff8c2a', warn:1.1, live:0.9,  dmg:12, tmin:6.0, tmax:10.0},
];
let haz={phase:'idle',t:3,x:W/2,dir:1,hit:[false,false],imp:false,tmr:0};
function resetHazards(){ haz={phase:'idle',t:rnd(2.5,4.5),x:rnd(60,W-60),dir:Math.random()<.5?1:-1,hit:[false,false],imp:false,tmr:0}; }
function updateHazards(dt){
  if(game.state!=='fight'||!game.mechs.length) return;
  const info=HAZ_INFO[game.mapIdx]||HAZ_INFO[0];
  haz.tmr+=dt;
  if(haz.phase==='idle'){
    haz.t-=dt;
    if(haz.t<=0){ haz.phase='warn'; haz.tmr=0; haz.hit=[false,false]; haz.imp=false;
      haz.x=rnd(60,W-60); haz.dir=Math.random()<.5?1:-1; }
  }else if(haz.phase==='warn'){
    if(haz.tmr>=info.warn){ haz.phase='live'; haz.tmr=0; }
  }else{
    if(game.mapIdx===1){                            // 旋风横向推移
      haz.x+=haz.dir*85*dt;
      if(haz.x<24||haz.x>W-24){ haz.dir*=-1; haz.x=clamp(haz.x,24,W-24); }
    }
    for(let i=0;i<game.mechs.length;i++){
      const m=game.mechs[i];
      if(m.dead||haz.hit[i]) continue;
      let inZone=false;
      if(game.mapIdx===0) inZone=Math.abs(m.x-haz.x)<24;                       // 闪电柱:全域高度
      else if(game.mapIdx===1) inZone=Math.abs(m.x-haz.x)<20&&m.y>GROUND-46;   // 旋风:贴地扫过
      else if(game.mapIdx===3) inZone=Math.abs(m.x-haz.x)<20&&m.y>GROUND-104;  // 岩浆柱:中低空
      if(inZone){ haz.hit[i]=true; hitMech(m,info.dmg,(Math.sign(m.x-haz.x)||1)*90,false); }
    }
    if(game.mapIdx===2&&!haz.imp&&haz.tmr>=info.live){   // 冰锥落地溅射
      haz.imp=true;
      sparks(haz.x,GROUND-4,'#bfe8ff',12,150); game.shake=Math.max(game.shake,3.5); sfx.boom();
      for(let i=0;i<game.mechs.length;i++){
        const m=game.mechs[i];
        if(!m.dead&&!haz.hit[i]&&Math.abs(m.x-haz.x)<30&&m.y>GROUND-40){
          haz.hit[i]=true; hitMech(m,info.dmg,0,false);
        }
      }
    }
    if(haz.tmr>=info.live){ haz.phase='idle'; haz.t=rnd(info.tmin,info.tmax); }
  }
}
function drawHazards(){
  if(haz.phase==='idle'||!game.mechs.length) return;
  if(game.state!=='fight'&&game.state!=='ko') return;
  const info=HAZ_INFO[game.mapIdx]||HAZ_INFO[0];
  const x=Math.round(haz.x);
  if(haz.phase==='warn'){                          // 预警:地面标记 + 感叹号
    const blink=Math.sin(T*14)>0;
    g.globalAlpha=blink?0.8:0.3;
    px(x-14,GROUND-2,28,2,info.col);
    px(x-1,GROUND-26,3,14,info.col); px(x-1,GROUND-8,3,3,info.col);
    g.globalAlpha=1;
    if(game.mapIdx===3&&blink){ g.globalAlpha=0.3; px(x-8,GROUND-6,16,4,'#ff5b1a'); g.globalAlpha=1; }
    if(game.mapIdx===0&&blink){ px(x-1,GROUND-64,2,10,'#7de3ff'); px(x-1,GROUND-46,2,8,'#7de3ff'); }
    return;
  }
  const pr=clamp(haz.tmr/info.live,0,1);
  if(game.mapIdx===0){                             // 闪电柱
    let yy=0,xx=x;
    g.globalAlpha=0.9;
    while(yy<GROUND){
      const ny=Math.min(GROUND,yy+ri(10,20)), nx=x+ri(-8,8);
      px(Math.min(xx,nx),yy,Math.max(2,Math.abs(nx-xx)),Math.max(2,ny-yy),'#bfe9ff');
      xx=nx; yy=ny;
    }
    g.globalAlpha=0.3; pixelCircle(x,GROUND-10,18,'#7de3ff'); g.globalAlpha=1;
  }else if(game.mapIdx===1){                       // 流沙旋风
    for(let i=0;i<6;i++){
      const yy=GROUND-6-i*9, wdt=26-i*3, off=Math.round(Math.sin(T*10+i*1.4)*6);
      g.globalAlpha=0.3+0.09*i;
      px(x-wdt/2+off,yy,wdt,3,i%2?'#e8c07a':'#c9924f');
    }
    g.globalAlpha=1;
  }else if(game.mapIdx===2){                       // 冰锥坠落
    const fy=-24+pr*(GROUND+16);
    g.fillStyle='#bfe8ff';
    g.beginPath(); g.moveTo(x-5,fy); g.lineTo(x+5,fy); g.lineTo(x,fy+22); g.closePath(); g.fill();
    px(x-1,fy-12,2,12,'rgba(191,232,255,.45)');
  }else{                                           // 岩浆喷泉
    const env=pr<0.2?pr/0.2:(pr>0.7?(1-pr)/0.3:1);
    const hgt=Math.round(105*env);
    for(let yy=GROUND;yy>GROUND-hgt;yy-=6){
      const wdt=Math.max(3,10-((GROUND-yy)*0.05|0))+ri(0,3);
      g.globalAlpha=0.85;
      px(x-wdt/2+Math.round(Math.sin(T*20+yy)*2),yy,wdt,5,(yy%12<6)?'#ff8c2a':'#ffd166');
    }
    g.globalAlpha=1;
    if(Math.random()<0.5) particles.push({x:x+rnd(-8,8),y:GROUND-hgt,vx:rnd(-40,40),vy:rnd(-80,-30),life:rnd(0.3,0.6),max:0.6,col:'#ffd166',sz:2,g:260});
  }
}

/* ---------------- 6. 机甲实体与像素绘制 ---------------- */
class Mech{
  constructor(id,ch,ctrl){
    this.id=id; this.ch=ch; this.pal=ch.pal; this.ctrl=ctrl; this.wins=0;
    this.team=id===0?0:1;                 // 阵营:0=玩家方 1=敌方(故事模式多单位区分敌我)
    this.isMob=false; this.isBoss=false;  // 故事模式标记(绘制/结算用)
    this.invincible=false; this.passive=false;  // 训练模式靶机:不死 / 完全被动
    this.maxHp=ch.hp; this.spd=ch.spd; this.jumpV=ch.jump; this.atkMul=ch.atk;
    this.bulletDmg=ch.bullet; this.regen=ch.regen; this.size=ch.size; this.guardMul=ch.guardMul||0.15;
    this.pCount=ch.pCount||1; this.pSize=ch.pSize||1;   // 投射物数量/体积倍率(隐藏机体 >1)
    this.weapon=ch.weapon||'rifle'; this.canFly=!!ch.canFly;
    this.meleeW=ch.meleeW||'saber'; this.mw=MELEE_WEP[this.meleeW]||MELEE_WEP.saber;  // 近战兵装
    this.atkDur=this.mw.atkT;                        // 当前挥砍时长(结算用)
    // 技能槽列表(按 HUD 显示顺序)与冷却表
    this.skillSlots=['nJ','fJ','bJ','nK','fK','bK'].filter(s=>ch.skills&&ch.skills[s]).map(s=>({slot:s,id:ch.skills[s]}));
    this.reset(0,1);
  }
  reset(x,facing){
    this.x=x; this.y=GROUND; this.vx=0; this.vy=0; this.facing=facing;
    this.hp=this.maxHp; this.chipHp=this.maxHp; this.energy=100;
    this.onGround=true; this.guarding=false; this.dead=false;
    this.atkT=0; this.atkCd=0; this.hitDone=true; this.shootCd=0; this.muzzleT=0;
    this.stunT=0; this.stunCd=0; this.flash=0; this.walkT=0; this.moving=false; this.smokeT=0; this.slowT=0;
    // 技能与飞行状态
    this.cds={}; this.comboT=0; this.comboDir=0;                 // 技能冷却表 + 防御输入窗口
    this.siege=false; this.siegeT=0; this.overT=0; this.cloakT=0; this.cloakAtk=false;
    this.fortifyT=0; this.burstT=0; this.shieldT=0; this.roarT=0; this.speedBoostT=0;
    this.dashT=0; this.dashHit=false; this.spinT=0; this.spinHit=false;
    this.dashDir=1; this.dashSpd=520; this.dashDmgMul=1.2; this.dashKb=150;
    this.inBuf=null;                         // 人类玩家输入缓冲(硬直期间的边沿输入暂存)
    this.burstN=0; this.burstGap=0; this.burstGap0=0.15;
    this.flying=false; this.flyFuel=2.5; this.flyMax=2.5; this.lastUpT=-9;
    this.ai={t:0,move:0,guardT:0};           // 每机体独立 AI 记忆(避免多单位互相污染)
  }
  get inAction(){ return this.atkT>0; }
  update(dt,game){
    const opp=game.other(this);
    // 定时器
    this.flash=Math.max(0,this.flash-dt); this.atkCd=Math.max(0,this.atkCd-dt);
    this.shootCd=Math.max(0,this.shootCd-dt); this.muzzleT=Math.max(0,this.muzzleT-dt);
    this.stunT=Math.max(0,this.stunT-dt); this.stunCd=Math.max(0,this.stunCd-dt); this.slowT=Math.max(0,this.slowT-dt);
    for(const k in this.cds) if(this.cds[k]>0) this.cds[k]=Math.max(0,this.cds[k]-dt);
    this.comboT=Math.max(0,this.comboT-dt);
    this.speedBoostT=Math.max(0,this.speedBoostT-dt); this.roarT=Math.max(0,this.roarT-dt);
    this.overT=Math.max(0,this.overT-dt); this.cloakT=Math.max(0,this.cloakT-dt);
    this.fortifyT=Math.max(0,this.fortifyT-dt); this.burstT=Math.max(0,this.burstT-dt);
    this.shieldT=Math.max(0,this.shieldT-dt); this.spinT=Math.max(0,this.spinT-dt);
    if(this.atkT>0) this.atkT=Math.max(0,this.atkT-dt);
    if(this.dead){ // 残骸冒烟
      this.smokeT-=dt;
      if(this.smokeT<=0){ this.smokeT=0.14;
        particles.push({x:this.x+rnd(-14,10),y:this.y-rnd(2,10),vx:rnd(-8,8),vy:rnd(-40,-15),life:rnd(0.4,0.9),max:0.9,col:'#4a4f5e',sz:ri(2,3),g:-40});
      }
      this.physics(dt); return;
    }
    // 朝向对手(挥砍中不转向)
    if(opp && !(this.atkT>0.14)) this.facing = opp.x>=this.x?1:-1;
    // 获取输入:人类玩家即使处于受击硬直也持续采样键盘,并把边沿输入暂存到短时缓冲,
    // 硬直结束后的若干帧内补发 —— 避免被敌方连续弹幕的硬直锁死而"按键无响应"
    const isHuman=this.ctrl!=='cpu';
    let hu=null;
    if(isHuman && game.state==='fight'){
      hu=humanInput(MAP[this.ctrl]);
      const b=this.inBuf||(this.inBuf={jump:0,atk:0,shoot:0,upEdge:0,downEdge:0});
      // 缓冲寿命 0.4s,覆盖满硬直(0.3s)与硬直保护下的最短可操作窗口,确保硬直期间按键不丢
      if(hu.jump)     b.jump=0.4;
      if(hu.atk)      b.atk=0.4;
      if(hu.shoot)    b.shoot=0.4;
      if(hu.upEdge)   b.upEdge=0.4;
      if(hu.downEdge) b.downEdge=0.4;
      for(const k in b) if(b[k]>0) b[k]=Math.max(0,b[k]-dt);
    }
    let inp=NO_INP;
    if(game.state==='fight' && this.stunT<=0){
      if(isHuman){
        inp=hu;
        const b=this.inBuf;                  // 补发硬直期间缓存的边沿输入(消费后清零)
        if(b){
          if(b.jump>0){ inp.jump=true; b.jump=0; }
          if(b.atk>0){ inp.atk=true; b.atk=0; }
          if(b.shoot>0){ inp.shoot=true; b.shoot=0; }
          if(b.upEdge>0){ inp.upEdge=true; b.upEdge=0; }
          if(b.downEdge>0){ inp.downEdge=true; b.downEdge=0; }
        }
      }
      else inp=cpuInput(this,opp,game,dt);
    }
    // 技能输入窗口:按下防御瞬间开启 0.5s,窗口内 方向(无/前/后)+斩/射 组合施放技能槽
    if(inp.downEdge){ this.comboT=0.5; this.comboDir=0; }
    let justCast=false;
    if(this.comboT>0 && this.stunT<=0 && (inp.atk||inp.shoot)){
      const dir=inp.left&&!inp.right?-1:(inp.right&&!inp.left?1:0);
      if(dir) this.comboDir=dir;
      const d=this.comboDir;
      const slot=(d===0?'n':(d===this.facing?'f':'b'))+(inp.atk?'J':'K');
      const id=this.ch.skills&&this.ch.skills[slot];
      if(id && (this.cds[id]||0)<=0 && !(id==='vulcan'&&(!this.onGround||this.flying))){
        justCast=this.castSkill(slot,opp);
        this.comboT=0;                       // 消费输入窗口
      }
      // 槽位为空或冷却中:不消费,回退为普通攻击/射击
    }
    // 防御(仅地面、非攻击中、非攻城模式)
    this.guarding = inp.guard && this.onGround && this.atkT<=0 && !this.siege;
    if(this.stunT>0){                    // 受击硬直:击退滑行 + 摩擦
      this.vx*=Math.max(0,1-4*dt);
    }else if(this.guarding){
      this.vx=0;
    }else{
      this.moving=false;
      const spdMul=(this.speedBoostT>0?1.5:1)*(this.slowT>0?0.55:1);   // 战术翻滚增益 / 寒冰减速
      if(this.siege){ this.vx=0; }                    // 机炮形态:定身炮塔
      else if(inp.left){ this.vx=-this.spd*spdMul; this.moving=true; }
      else if(inp.right){ this.vx=this.spd*spdMul; this.moving=true; }
      else this.vx=0;
      if(this.moving) this.walkT+=dt*11;
      if(inp.jump && this.onGround && !this.siege){ this.vy=-this.jumpV; this.onGround=false; sfx.jump(); }
      if(inp.atk && !justCast && this.atkCd<=0 && (this.onGround||this.flying) && !this.siege){
        this.atkDur=this.mw.atkT; this.atkT=this.atkDur; this.atkCd=this.mw.cd; this.hitDone=false; sfx.swing();
      }
      if(inp.shoot && !justCast){
        if(this.flying && inp.down && this.ch.airW) this.fireAir(opp);   // 空中特化武装
        else this.fire(this.flying?lockAngle(this,opp):(this.facing>0?0:Math.PI));
      }
    }
    // 飞行:空中 0.3s 内双击上起飞(仅 canFly 机体)
    if(this.canFly && !this.dead){
      if(inp.upEdge){
        if(!this.onGround && !this.flying && T-this.lastUpT<0.3 && this.flyFuel>0.3){
          this.flying=true; this.vy=0; sfx.jump();
          for(let i=0;i<8;i++) particles.push({x:this.x+rnd(-10,10),y:this.y,vx:rnd(-30,30),vy:rnd(30,80),life:0.3,max:0.3,col:'#7df9ff',sz:2,g:0});
        }
        this.lastUpT=T;
      }
      if(this.flying){
        this.flyFuel-=dt;
        if(this.flyFuel<=0){ this.flyFuel=0; this.flying=false; }
        else if(T%0.1<dt) particles.push({x:this.x-this.facing*8,y:this.y-4,vx:rnd(-10,10),vy:rnd(40,80),life:0.25,max:0.25,col:'#7df9ff',sz:1,g:0});
      }else if(this.onGround){
        this.flyFuel=Math.min(this.flyMax,this.flyFuel+dt*1.6);
      }
    }
    // 冲刺类技能:位移 + 冲撞判定(参数化:方向/速度/伤害倍率/击退)
    if(this.dashT>0){
      this.dashT-=dt; this.vx=this.dashDir*this.facing*this.dashSpd;
      for(let i=0;i<2;i++) particles.push({x:this.x+this.facing*rnd(-6,10),y:this.y-rnd(6,40),vx:-this.dashDir*this.facing*rnd(30,90),vy:rnd(-25,25),life:0.24,max:0.24,col:this.pal.saber,sz:ri(1,2),g:0});
      if(opp&&!opp.dead&&!this.dashHit&&this.dashDmgMul>0&&Math.abs(opp.x-this.x)<34&&Math.abs(opp.y-this.y)<40){
        this.dashHit=true; hitMech(opp,Math.round(MELEE_DMG*this.dashDmgMul*this.atkMul*this.mw.dmg*roleMeleeMul(this)),this.facing*this.dashKb,true);
      }
    }
    // 回旋斩:旋转光剑周身一次判定
    if(this.spinT>0){
      particles.push({x:this.x+rnd(-26,26),y:this.y-rnd(6,34),vx:0,vy:0,life:0.12,max:0.12,col:this.pal.saber,sz:2,g:0});
      if(!this.spinHit&&opp&&!opp.dead&&Math.abs(opp.x-this.x)<36&&Math.abs(opp.y-this.y)<40){
        this.spinHit=true; hitMech(opp,Math.round(MELEE_DMG*this.atkMul*this.mw.dmg*roleMeleeMul(this)),(Math.sign(opp.x-this.x)||1)*130,true);
      }
    }
    // 技能连发队列(速射三连/火箭齐射):不耗能快速打完剩余弹
    if(this.burstN>0){
      this.burstGap-=dt;
      if(this.burstGap<=0){
        this.shootCd=0;                     // 连发期间忽略常规射击间隔
        const ang=this.flying&&opp&&!opp.dead?lockAngle(this,opp):(this.facing>0?0:Math.PI);
        if(this.fire(ang)){ this.burstN--; this.burstGap=this.burstGap0; }
        else this.burstN=0;
      }
    }
    // 火神炮模式:定时解除;期间自动向对手方向倾泻 5 连发扇形弹幕(不耗能)
    if(this.siegeT>0){
      this.siegeT-=dt;
      if(this.siegeT<=0){ this.siegeT=0; this.siege=false; }
      else if(opp&&!opp.dead) this.fire(lockAngle(this,opp));
    }
    this.energy=Math.min(100,this.energy+this.regen*dt*(this.burstT>0?3:1));
    if(this.invincible) this.hp=Math.min(this.maxHp,this.hp+this.maxHp*0.28*dt);  // 靶机:持续快速回血
    this.physics(dt,inp);
    this.x=clamp(this.x,16,W-16);
  }
  /* 统一射击入口:按专属武器生成子弹;火神炮模式强制 5 连发扇形机炮 */
  fire(ang){
    if(this.shootCd>0) return false;
    let wid=this.weapon, w=WEAPONS[wid], cdMul=1, fan=w.fan||1, fanArc=w.fanArc||0;
    if(this.overT>0) cdMul=0.64;                      // 过载射击:射速提升

        drones.push({ x:this.x-this.facing*26, y:this.y-54*this.size, team:this.team, own:this.id,
          t:8, cd:1, hover:rnd(0,6.28), kind:'heal', heal:Math.max(4,Math.round(6+this.maxHp*0.03)) });
        sparks(this.x,this.y-48*this.size,'#8fffc0',12,90); sfx.round(); break;
      case 'lightning': {                     // 雷击锁定:锁定最近敌人,3 秒内每 0.2s 落雷(不硬直)
        let tgt=null,bd=1e9;
        for(const e of game.enemiesOf(this)){ if(e.dead) continue; const dd=Math.abs(e.x-this.x); if(dd<bd){bd=dd;tgt=e;} }
        if(!tgt) return false;                // 无目标:不进入冷却
        lightnings.push({ own:this.id, team:this.team, tgt:tgt.id, t:3, gap:0.2,
          dmg:Math.max(2,Math.round(this.bulletDmg*0.30)) });
        sparks(this.x,this.y-30*this.size,'#c9a6ff',10,80); sfx.round(); break; }
      case 'iceball':                         // 寒冰球:缓慢前飞,阻挡敌弹并对接触敌人造成伤害
        iceballs.push({ x:this.x+this.facing*24*this.size, y:this.y-24*this.size,
          vx:this.facing*46, vy:0, own:this.id, team:this.team, r:Math.round(15*this.pSize), hp:40, t:7,
          dmg:Math.max(3,Math.round(this.bulletDmg*1.45)) });
        sparks(this.x+this.facing*24*this.size,this.y-24*this.size,'#9fe8ff',12,80);
        sfx.shoot(); break;
      case 'emorb': {                         // 电磁球:向前放出 4 颗缓慢前飘的电磁球,拦弹+磁力干扰减速
        const n=Math.max(1,Math.round(4*this.pCount));
        for(let i=0;i<n;i++){
          emorbs.push({ x:this.x+this.facing*(20+i*7)*this.size, y:this.y-24*this.size-i*13,
            vx:this.facing*42, vy:0, own:this.id, team:this.team,
            r:Math.round(9*this.pSize), hp:Math.max(12,Math.round(26*this.pSize)), t:8,
            ph:rnd(0,6.28), dmg:Math.max(2,Math.round(this.bulletDmg*0.55)), hitSet:null });
        }
        sparks(this.x,this.y-28*this.size,'#b18cff',12,80); sfx.round(); break; }
    }
    this.cds[id]=sk.cd;                     // 施放成功才进入冷却
    return true;
  }
  updateHud(dt){
    this.chipHp=Math.max(this.hp,this.chipHp-26*dt);
  }
}

/* 像素绘制:机甲由矩形部件拼装,1 单位 = 1 像素 */
function drawMech(m){
  const c=m.pal, t=T;
  g.save();
  g.translate(Math.round(m.x),Math.round(m.y));
  const sz=m.size||1;                       // 体型缩放(绘制/碰撞/斩击范围同步)
  g.scale(m.facing*sz,sz);
  const P=(x,y,w,h,col)=>{ g.fillStyle=(m.flash>0)?'#ffffff':col; g.fillRect(x,y,w,h); };
  if(m.dead){ drawWreck(P,c); g.restore(); return; }

  if(m.siege){                            // 火神炮/机炮形态:坐地炮台 + 蓄光呼吸
    const gl=0.20+0.12*Math.sin(t*9)+(m.muzzleT>0?0.15:0);
    g.globalAlpha=gl; g.fillStyle=c.visor;
    g.beginPath(); g.arc(0,-16,30,0,Math.PI*2); g.fill();
    g.globalAlpha=Math.min(0.8,gl*1.6);
    g.beginPath(); g.arc(0,-16,19,0,Math.PI*2); g.fill();
    g.globalAlpha=1;
    const rec=m.muzzleT>0?2:0;            // 开火后坐
    P(-13,-6,9,6,c.dark); P(4,-6,9,6,c.dark);            // 展开支撑腿
    P(-11,-3,22,3,c.joint);                              // 底盘
    P(-9,-20,18,14,c.main);                              // 低矮躯干
    P(1,-18,8,9,c.light);                                // 胸甲
    P(-6,-16,5,1,c.dark); P(-6,-13,5,1,c.dark);          // 散热格栅
    P(-3,-27,11,7,c.joint); P(3,-25,5,2,c.visor);        // 头部+目镜
    P(7,-20,3,7,c.main);                                 // 肩部
    P(9,-19+rec,17,5,c.gun); P(24,-21+rec,3,9,c.gun);    // 机炮身管+制退器
    if(m.muzzleT>0){ P(27,-20+rec,7,7,'#fff2c0'); P(33,-19+rec,4,5,'#ffd166'); }
    g.restore(); return;
  }

  // 待机呼吸(2 帧) / 行走摆腿
  let bob = (m.onGround && m.atkT<=0) ? (Math.sin(t*5+m.id*2)>0?0:1) : 0;
  if(m.guarding) bob=2;
  const swing = (m.onGround&&m.moving) ? Math.round(Math.sin(m.walkT)*3) : 0;

  if(m.onGround){
    P(-7-swing,-13+bob,5,13,c.dark);  P(-8-swing,-2+bob,7,2,c.joint);   // 后腿+脚
    P( 2+swing,-13+bob,5,13,c.main);  P( 1+swing,-2+bob,7,2,c.joint);   // 前腿+脚
  }else{
    P(-7,-9,5,9,c.dark);  P(-8,-2,7,2,c.joint);                         // 收腿
    P( 2,-7,5,7,c.main);  P( 1,-2,7,2,c.joint);
    const fh=3+((t*30|0)%4);                                            // 跳跃喷焰
    P(-3,0,6,fh,(t*20%2<1)?'#ffd166':'#ff8c42'); P(-1,fh,2,2,'#fff2c0');
  }
  P(-8,-17+bob,16,5,c.dark);                                            // 腰胯
  P(-9,-30+bob,18,13,c.main);                                           // 躯干
  P(1,-28+bob,8,9,c.light);                                             // 胸甲
  P(-6,-26+bob,5,1,c.dark); P(-6,-23+bob,5,1,c.dark); P(-6,-20+bob,5,1,c.dark); // 散热格栅
  P(-2,-18+bob,6,1,c.visor);                                            // 腰部指示灯
  P(7,-31+bob,6,7,c.joint); P(8,-30+bob,4,5,c.light);                   // 前肩甲
  P(-4,-38+bob,12,8,c.joint);                                           // 头盔
  P(2,-36+bob,6,3,c.visor);                                             // 目镜
  P(-3,-42+bob,1,4,c.dark); P(-3,-43+bob,1,1,c.visor);                  // 天线

  // 后臂(持近战兵装,攻击时挥出):不同机师使用匕首/长枪/战锤/大剑/光刃,造型与弧线各异
  P(-13,-29+bob,5,9,c.dark);
  const wep=m.meleeW||'saber';
  if(m.atkT>0){
    const p=1-m.atkT/(m.atkDur||ATK_TIME);
    const ang=-1.9+p*2.6;
    const drawWep=(alpha,off)=>{
      g.globalAlpha=alpha; g.save();
      g.translate(-11,-27+bob); g.rotate(ang+off);
      if(wep==='dagger'){                      // 匕首:短刃急刺
        g.fillStyle=c.joint; g.fillRect(-3,-1,5,2);
        g.fillStyle=c.saber||'#dfe6f2'; g.fillRect(2,-1,10,2);
        g.fillStyle='#ffffff'; g.fillRect(2,0,10,1);
      }else if(wep==='spear'){                 // 长枪:长杆+枪尖(直刺)
        g.fillStyle='#6a5a44'; g.fillRect(-6,-1,34,3);
        g.fillStyle=c.joint; g.fillRect(-4,-2,6,4);
        g.fillStyle=c.light; g.beginPath(); g.moveTo(28,-3); g.lineTo(38,0); g.lineTo(28,3); g.closePath(); g.fill();
      }else if(wep==='hammer'){                // 战锤:短柄+重型锤头
        g.fillStyle='#5a4a34'; g.fillRect(-3,-1,16,3);
        g.fillStyle=c.dark; g.fillRect(13,-6,9,12);
        g.fillStyle=c.light; g.fillRect(13,-6,9,3);
        g.fillStyle=c.joint; g.fillRect(13,3,9,3);
      }else if(wep==='greatsword'){            // 大剑:宽厚巨刃
        g.fillStyle=c.joint; g.fillRect(-3,-2,6,4);
        g.fillStyle=c.light; g.fillRect(3,-3,30,6);
        g.fillStyle=c.saber; g.fillRect(3,-1,30,2);
        g.fillStyle='#ffffff'; g.fillRect(3,0,30,1);
      }else{                                    // 光刃(默认)
        g.fillStyle=c.joint; g.fillRect(-3,-1,5,2);
        g.fillStyle=c.saber; g.fillRect(2,-2,24,4);
        g.fillStyle='#ffffff'; g.fillRect(2,-1,24,2);
      }
      g.restore(); g.globalAlpha=1;
    };
    drawWep(0.35,-0.3); drawWep(1,0);
  }else{
    if(wep==='dagger'){ P(-14,-22+bob,3,5,c.joint); P(-15,-26+bob,2,4,c.light); }
    else if(wep==='spear'){ P(-19,-20+bob,14,3,'#6a5a44'); P(5,-21+bob,4,4,c.light); }
    else if(wep==='hammer'){ P(-16,-21+bob,3,7,'#5a4a34'); P(-19,-27+bob,8,7,c.dark); }
    else if(wep==='greatsword'){ P(-13,-22+bob,4,9,c.joint); P(-16,-32+bob,5,14,c.light); }
    else P(-14,-21+bob,3,4,c.joint);            // 光刃刀柄
  }
  // 前臂 + 步枪
  P(9,-27+bob,5,7,c.main);
  P(11,-25+bob,15,3,c.gun); P(16,-28+bob,2,3,c.gun); P(12,-22+bob,2,3,c.gun);
  if(m.muzzleT>0){
    P(26,-26+bob,6,5,'#fff2c0'); P(32,-25+bob,3,3,'#ffd166');
  }
  // 护盾
  if(m.guarding){
    P(11,-36+bob,5,27,c.light);
    P(11,-36+bob,5,2,c.dark); P(11,-11+bob,5,2,c.dark);
    P(13,-27+bob,2,6,c.visor);
    P(9,-27+bob,3,7,c.dark);
  }
  g.restore();
}

function drawWreck(P,c){
