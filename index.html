/* 机体光环特效:能量护盾=圆形护罩 / 强化技能=火焰形光圈 */
function drawMechEffects(m){
  if(!m||m.dead) return;
  const sz=m.size||1;
  const cx=Math.round(m.x), cy=Math.round(m.y-22*sz);
  // 能量护盾:圆形护罩(脉动 + 六边形网格)
  if(m.shieldT>0){
    const r=Math.round(27*sz), a=clamp(m.shieldT/2,0,1), pulse=0.5+0.5*Math.sin(T*10);
    g.save();
    g.globalAlpha=(0.16+0.10*pulse)*a;
    g.fillStyle='#8fe6ff'; g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.fill();
    g.globalAlpha=0.9*a; g.strokeStyle='#cdefff'; g.lineWidth=2;
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
    g.globalAlpha=0.45*a; g.strokeStyle='#7de3ff'; g.lineWidth=1;
    g.beginPath();
    for(let i=0;i<6;i++){ const an=T*0.7+i*Math.PI/3; const rx=cx+Math.cos(an)*r, ry=cy+Math.sin(an)*r;
      if(i===0) g.moveTo(rx,ry); else g.lineTo(rx,ry); }
    g.closePath(); g.stroke();
    g.restore();
  }
  // 强化技能:火焰形光圈(壁垒/过载/爆发/战吼/翻滚/攻城)
  if(m.fortifyT>0||m.overT>0||m.burstT>0||m.roarT>0||m.speedBoostT>0||m.siegeT>0){
    const baseR=Math.round(25*sz), flames=11;
    g.globalAlpha=0.22; g.fillStyle='#ff8c2a';
    g.beginPath(); g.arc(cx,cy,baseR,0,Math.PI*2); g.fill();
    for(let i=0;i<flames;i++){
      const an=(i/flames)*Math.PI*2 + T*2.4;
      const fr=baseR+3+Math.sin(T*12+i*1.7)*3;
      const fx=Math.round(cx+Math.cos(an)*fr), fy=Math.round(cy+Math.sin(an)*fr*0.85);
      const hh=3+2*Math.sin(T*14+i*2.1);
      g.globalAlpha=0.9; px(fx-1,Math.round(fy-hh),2,Math.round(hh+4),(i%2)?'#ff8c2a':'#ffd166');
      g.globalAlpha=0.65; px(fx,Math.round(fy-hh-2),1,3,'#fff2c0');
    }
    g.globalAlpha=1;
  }
}

/* ---------------- 7. 战斗结算 ---------------- */
function hitMech(def,dmg,kbx,melee,dot){
  if(def.dead||game.state!=='fight') return;
  let d=dmg;
  const att=game.other(def);
  if(def.shieldT>0){                       // 能量护盾:完全格挡
    def.flash=0.08; sparks(def.x,def.y-22,'#ffffff',6,80); sfx.guard(); return;
  }
  if(def.fortifyT>0) d=Math.max(1,Math.round(d*0.5));   // 震荡壁垒:受伤减半
  if(def.siege) d=Math.max(1,Math.round(d*0.7));        // 攻城模式:受伤 -30%
  if(def.guarding){                        // 防御:按机体减伤(默认 85%),小幅推挡
    d=Math.max(1,Math.round(d*def.guardMul));
    def.vx=kbx*0.5; def.flash=0.08;
    sparks(def.x+def.facing*13,def.y-22,'#9adcff',5,70);
    sfx.guard();
  }else{
    if(def.fortifyT>0||def.roarT>0||dot){ def.flash=0.08; }  // 壁垒/战吼/持续伤害:免疫击退与硬直
    else{
      def.vx=kbx;
      // 硬直保护:未处于硬直且不在保护期时才施加,避免多枚弹幕连续命中把玩家永久锁死
      if(def.stunT<=0 && def.stunCd<=0){ def.stunT=0.3; def.stunCd=0.5; }
      if(!def.onGround) def.vy=Math.min(def.vy,-30);
    }
    sparks(def.x+def.facing*8,def.y-24,'#ffd166',8,110);
    sparks(def.x+def.facing*8,def.y-24,'#ffffff',3,80);
    sfx.hit();
  }
  def.hp = def.invincible ? Math.max(1,def.hp-d) : Math.max(0,def.hp-d);  // 靶机血量下限锁在 1
  // 伤害数字分级:高伤更大更亮并闪光,低伤更小更暗
  let tcol='#cfd6e6', tsz=7, tglow=0;
  if(def.guarding){ tcol='#9adcff'; tsz=9; }
  else if(d>=30){ tcol='#fff2a0'; tsz=16; tglow=1; }
  else if(d>=18){ tcol='#ffd166'; tsz=13; tglow=1; }
  else if(d>=9){  tcol='#ffe9b0'; tsz=10; }
  dmgTexts.push({x:def.x+rnd(-6,6),y:def.y-44*def.size,val:d,col:tcol,sz:tsz,glow:tglow,life:0.65,max:0.65});
  def.flash=Math.max(def.flash,0.12);
  game.shake=Math.max(game.shake,def.guarding?2:4.5);
  if(def.hp<=0 && !def.invincible) killMech(def,kbx,att);
}
function killMech(def,kbx,att){
  def.dead=true; def.hp=0;
  def.flying=false; def.siege=false; def.siegeT=0; def.cloakT=0; def.cloakAtk=false;
  def.vy=-150; def.vx=kbx*1.2;
  explosion(def.x,def.y-20);
  game.shake=7;
  if(game.storyMode){ game.onStoryKill(def); return; }
  if(game.state!=='fight') return;
  game.state='ko'; game.koT=2.3;
  game.koWinner = (att && !att.dead) ? att : null;
  game.setAnn('K.O.!',7,1.6,'#ff5b5b');
  sfx.boom(); sfx.ko();
}
function meleeCheck(a,def){
  if(a.dead||def.dead||a.atkT<=0||a.hitDone) return;
  const w=a.mw||MELEE_WEP.saber, dur=a.atkDur||ATK_TIME;
  const p=1-a.atkT/dur;                        // 挥砍进度 0→1
  if(p>0.2 && p<0.62){                         // 有效命中窗口(与原光刃等价)
    const dx=(def.x-a.x)*a.facing;
    if(dx>2 && dx<w.range*a.size && Math.abs(def.y-a.y)<w.arc*Math.max(1,def.size)){
      let md=MELEE_DMG*a.atkMul*w.dmg*roleMeleeMul(a);
      if(a.cloakAtk){ md*=1.8; a.cloakAtk=false; a.cloakT=0; }   // 破隐一击
      a.hitDone=true; hitMech(def,Math.round(md),a.facing*w.kb,true);
    }
  }
}

/* ---------------- 8. AI 控制器(轻量决策,带反应间隔) ---------------- */
function cpuInput(m,opp,game,dt){
  const o={left:false,right:false,guard:false,up:false,down:false,upEdge:false,downEdge:false,jump:false,atk:false,shoot:false};
  if(m.passive) return o;                   // 训练靶机:完全被动,只挨打不还手
  if(!opp) return o;                        // 无敌人:待机
  const D=game.diffObj||DIFFS[1];           // 难度参数驱动
  const aiMem=m.ai||(m.ai={t:0,move:0,guardT:0,castCd:0});  // 每机体独立记忆
  aiMem.t-=dt; aiMem.guardT-=dt; aiMem.castCd=(aiMem.castCd||0)-dt;
  let casted=false;                         // 本帧是否已通过组合键施放技能
  const toRight=opp.x>m.x, dist=Math.abs(opp.x-m.x);
  // 技能施放:模拟 防御(开窗)+方向+攻击 组合键
  const castSlot=(slot)=>{
    const id=m.ch.skills&&m.ch.skills[slot];
    if(!id||(m.cds[id]||0)>0) return false;
    o.guard=true; o.downEdge=true; aiMem.move=0;
    if(slot[0]==='f'){ if(m.facing>0) o.right=true; else o.left=true; }
    else if(slot[0]==='b'){ if(m.facing>0) o.left=true; else o.right=true; }
    if(slot[1]==='J') o.atk=true; else o.shoot=true;
    casted=true;
    aiMem.castCd=rnd(0.55,1.25);            // 全局技能节流:避免 AI 连续倾泻技能
    return true;
  };
  if(aiMem.guardT>0){ o.guard=true; return o; }
  // 飞行姿态控制:跟随对手高度,燃料不足时主动下降
  if(m.flying){
    if(m.flyFuel<0.7) o.down=true;
    else if(opp.y<m.y-16) o.up=true;
    else if(opp.y>m.y+34) o.down=true;
  }
  if(aiMem.t<=0){
    aiMem.t=rnd(D.react[0],D.react[1]);
    // —— 技能决策:从可用槽位中按局势随机挑选一个施放(受全局节流限制)——
    if(aiMem.castCd<=0){
      const el=[];
      for(const s of m.skillSlots){
        const id=s.id; if((m.cds[id]||0)>0) continue;
        let ok=false;
        switch(id){
          case 'dash':       ok=dist>90&&dist<170&&Math.random()<0.5; break;
          case 'triple':     ok=dist>60&&dist<200&&Math.random()<0.45; break;
          case 'tumble':     ok=dist<70&&Math.random()<0.5; break;
          case 'fortify':    ok=dist<150&&Math.random()<0.4; break;
          case 'rocketsalvo':ok=dist>110&&dist<280&&Math.random()<0.55; break;
          case 'mortarBarrage':ok=dist>90&&dist<330&&Math.random()<0.55; break;
          case 'blinkF':     ok=dist>130&&Math.random()<0.6; break;
          case 'blinkB':     ok=dist<60&&Math.random()<0.5; break;
          case 'spin':       ok=dist<60&&Math.random()<0.6; break;
          case 'eshield':    ok=(m.hp<m.maxHp*0.5||opp.atkT>0.14)&&Math.random()<0.5; break;
          case 'shieldbash': ok=dist>80&&dist<170&&Math.random()<0.5; break;
          case 'vulcan':     ok=dist>130&&m.energy>40&&Math.random()<0.6; break;
          case 'overcharge': ok=dist<180&&Math.random()<0.45; break;
          case 'twinlaser':  ok=dist>130&&dist<280&&Math.random()<0.5; break;
          case 'leapblast':  ok=dist<95&&Math.random()<0.5; break;
          case 'cloak':      ok=m.hp<m.maxHp*0.6&&Math.random()<0.6; break;
          case 'shadow':     ok=dist>90&&Math.random()<0.5; break;
          case 'shadowdash': ok=dist>100&&dist<200&&Math.random()<0.55; break;
          case 'trample':    ok=dist>100&&dist<210&&Math.random()<0.55; break;
          case 'roar':       ok=dist<80&&Math.random()<0.5; break;
          case 'burst':      ok=m.energy<40; break;
          case 'arcburst':   ok=dist>70&&dist<170&&Math.random()<0.5; break;
          case 'judgement':  ok=dist>70&&Math.random()<0.55; break;
          case 'oblivion':   ok=dist<130&&Math.random()<0.6; break;
          case 'hellfire':   ok=dist>110&&dist<340&&Math.random()<0.6; break;
          case 'incendiary': ok=dist>70&&dist<260&&Math.random()<0.55; break;
          case 'drone':      ok=Math.random()<0.5; break;
          case 'cover':      ok=(dist>60&&opp.atkT>0)||(dist>110&&Math.random()<0.4); break;
          case 'healDrone':  ok=m.hp<m.maxHp*0.6&&Math.random()<0.6; break;
          case 'lightning':  ok=dist<320&&Math.random()<0.55; break;
          case 'iceball':    ok=dist>80&&dist<230&&Math.random()<0.5; break;
          case 'emorb':      ok=dist>60&&dist<240&&Math.random()<0.5; break;
          case 'missileSalvo':ok=dist>120&&dist<340&&Math.random()<0.55; break;
          case 'rocketBarrage':ok=dist>110&&dist<280&&Math.random()<0.55; break;
          case 'drone3':     ok=Math.random()<0.55; break;
        }
        if(ok) el.push(s.slot);
      }
      if(el.length) castSlot(el[ri(0,el.length-1)]);
    }
    const shootP=m.flying?D.shootP*2.2:D.shootP;      // 飞行锁定:射弹倾向提升
    const vis=opp.cloakT<=0;                          // 对手隐身:停火且丢失锁定
    const rl=roleOf(m.ch);                             // 战斗定位:近战贴脸 / 远程拉开
    const pref=(WEAPONS[m.weapon].range||120)*rl.pref; // 机体交战距离偏好(按定位缩放)
    const ranged=pref>=140;                           // 远程特化:保持距离火力输出
    const meleeBias=rl.melee>1;                        // 近战定位:贴身更主动
    if(dist>46){
      if(dist>pref+55){                               // 距离过远:逼近
        aiMem.move=toRight?1:-1;
        if(vis&&m.energy>=ENERGY_COST+20&&Math.random()<shootP*1.4) o.shoot=true;
      }else if(ranged&&dist<pref-45){                 // 远程机体被逼近:后撤周旋
        aiMem.move=toRight?-1:1;
        if(vis&&m.energy>=ENERGY_COST&&Math.random()<shootP*1.7) o.shoot=true;
        if(dist<80&&m.onGround&&Math.random()<0.35) o.jump=true;
      }else{                                          // 交战区间:小幅走位+持续输出
        aiMem.move=Math.random()<0.3?(Math.random()<.5?1:-1):0;
        if(vis&&m.shootCd<=0&&m.energy>=ENERGY_COST&&Math.random()<shootP*(ranged?1.9:1.1)) o.shoot=true;
        if(!ranged&&Math.random()<0.12) o.jump=true;
      }
    }else{
      aiMem.move=0;
      if(ranged&&Math.random()<0.72){                 // 远程机体近身:拉开距离反击
        aiMem.move=toRight?-1:1; aiMem.t=rnd(0.18,0.35);
        if(vis&&m.energy>=ENERGY_COST&&Math.random()<shootP*1.5) o.shoot=true;
      }else if(opp.atkT>0.14&&Math.random()<D.guardP*(meleeBias?0.8:1)){ aiMem.guardT=rnd(0.25,0.45); }
      else if(m.atkCd<=0&&Math.random()<D.atkP*(meleeBias?1.4:1)) o.atk=true;
      else if(vis&&m.shootCd<=0&&m.energy>=ENERGY_COST&&Math.random()<shootP) o.shoot=true;
      else if(Math.random()<0.15) o.jump=true;
      else if(Math.random()<D.retreat*(meleeBias?0.35:1)){ aiMem.move=toRight?-1:1; aiMem.t=rnd(0.15,0.3); }
    }
    // 空中特化武装:飞行中概率发射追踪弹/迫击炮
    if(m.flying&&m.ch.airW&&dist>110&&m.energy>=WEAPONS[m.ch.airW].cost&&Math.random()<0.4){ o.down=true; o.shoot=true; }
    if(!m.onGround&&Math.random()<0.05) o.jump=true;
  }
  // 可飞行机体:空中概率补第二段上键起飞
  if(m.canFly&&!m.onGround&&!m.flying&&m.flyFuel>1.2&&Math.random()<dt*6) o.upEdge=true;
  if(!casted){                              // 已施放技能:保留组合键方向,不再被走位/格挡覆盖
    if(aiMem.move===1) o.right=true; else if(aiMem.move===-1) o.left=true;
    // 对手近身挥砍时概率举盾
    if(dist<60&&opp.atkT>0.1&&aiMem.guardT<=0&&Math.random()<D.guardP*0.7) aiMem.guardT=0.3;
    if(aiMem.guardT>0){ o.guard=true; o.left=o.right=false; }
  }
  return o;
}

/* ---------------- 9. 比赛流程 ---------------- */
const game={
  state:'title',        // title | diff | select | cpuPick | map | vs | intro | fight | ko | end
  mode:0,               // 0=双人 1=人机
  diffObj:DIFFS[1], select:null, mapIdx:0,
  round:1, timer:ROUND_TIME, koT:0, koWinner:null,
  shake:0, ann:null, pause:false, t:0,
  mechs:[],
  storyMode:false, storyIdx:0, storySel:{cursor:0}, storyWave:0, storyWaves:[], storyScenT:0,
  storyHero:0, storyPick:{cursor:0},
  storyWin:false, storyResT:0, storyUnlockMsg:null, storyMode0:false,
  challengeStreak:0,   // 挑战 AI 模式:当前连胜场数(玩家取胜后自动换对手继续)
  spectateNextT:0,     // 观赏模式:当前场结束后自动换人续场的倒计时
  spectateWinner:null, // 观赏模式:上一场获胜方(结算界面用)
  enemiesOf(m){ return this.mechs.filter(o=>o!==m && o.team!==m.team && !o.dead); },
  other(m){                                 // 最近的敌对单位(1v1 与故事模式多单位通用)
    const e=this.enemiesOf(m); if(!e.length) return null;
    let best=e[0], bd=Math.abs(e[0].x-m.x);
    for(const o of e){ const d=Math.abs(o.x-m.x); if(d<bd){ bd=d; best=o; } }
    return best;
  },
  setAnn(text,size,dur,col){ this.ann={text,size,dur,t:dur,col:col||'#ffffff'}; },
  beginFlow(mode){        // 标题进入:0 双人 → 直接选人;1 人机 → 先选难度
    this.mode=mode;
    this.storyMode=false;
    this.mechs=[]; bullets=[]; particles=[];
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.select={cursor:0,idx1:-1,idx2:-1,phase:'p1',t:0,pickT:0};
    this.mapIdx=0;
    this.challengeStreak=0;
    this.state = mode===1?'diff':'select';
    sfx.ui();
  },
  setupMatch(){           // 双方机体确定后开赛
    const S=this.select;
    const c1=CHARS[S.idx1], base=CHARS[S.idx2];
    // 同型机体对战时,P2 使用 B 涂装(主/亮色互换)
    const ch2 = S.idx1===S.idx2
      ? Object.assign({},base,{pal:Object.assign({},base.pal,{main:base.pal.light,light:base.pal.main})})
      : base;
    this.mechs=[ new Mech(0,c1,this.mode===3?'cpu':'p1'),
                 new Mech(1,ch2,(this.mode===1||this.mode===3)?'cpu':'p2') ];
    this.mechs[0].wins=0; this.mechs[1].wins=0;
    this.round=1; this.startRound();
  },
  startRound(){
    this.mechs[0].reset(120,1); this.mechs[1].reset(360,-1);
    bullets=[]; particles=[]; dmgTexts=[]; resetHazards();
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.timer=ROUND_TIME; this.koWinner=null;
    this.state='intro'; this.introT=1.7;
    this.setAnn('ROUND '+this.round,24,1.1,'#ffe27a');
    sfx.round();
  },
  endRound(winner){
    if(winner) winner.wins++;
    if(this.mode===2){                          // 训练模式:靶机不死,玩家阵亡则原地重开
      this.startRound();
      this.setAnn('机体损毁 — 重新开始训练',18,1.6,'#ff9a9a');
      return;
    }
    if(this.mode===3 && winner){              // 观赏模式:单场定胜负,结束后自动换人续场
      this.state='end'; this.spectateNextT=3.4;
      this.spectateWinner=winner;
      this.setAnn(mechLabel(winner)+' '+winner.ch.name+' 获胜!',20,99,'#7df9ff');
      return;
    }
    if(winner && winner.wins>=2){
      if(this.mode===1){                       // 挑战 AI:玩家取胜 → 换对手续战;AI 取胜 → 挑战结束
        if(winner===this.mechs[0]){ this.challengeStreak++; this.nextChallenger(); return; }
        this.state='end';
        this.setAnn(mechLabel(winner)+' '+winner.ch.name+' 获胜!',20,99,'#ffe27a');
        return;
      }
      this.state='end';
      this.setAnn(mechLabel(winner)+' '+winner.ch.name+' 获胜!',20,99,'#ffe27a');
    }else{
      if(winner===null){ /* 平局重赛同一回合 */ }
      else this.round++;
      this.startRound();
    }
  },
  nextChallenger(){        // 挑战 AI:随机抽一位新对手,直接展开下一场
    const S=this.select, c1=CHARS[S.idx1];
    const pool=[];
    for(let i=0;i<CHARS.length;i++) if(i!==S.idx2 && charUnlocked(i)) pool.push(i);
    if(pool.length) S.idx2=pool[ri(0,pool.length-1)];
    const base=CHARS[S.idx2];
    const ch2 = S.idx1===S.idx2
      ? Object.assign({},base,{pal:Object.assign({},base.pal,{main:base.pal.light,light:base.pal.main})})
      : base;
    this.mechs=[ new Mech(0,c1,'p1'), new Mech(1,ch2,'cpu') ];
    this.round=1;
    this.startRound();
    this.setAnn('下一位挑战者  '+ch2.name+'   ·   连胜 '+this.challengeStreak,18,1.7,'#ff8a5b');
  },
  /* ---- 训练模式:与不死靶机自由练习 ---- */
  beginTraining(){         // 标题进入:选择练习用机体
    this.mode=2; this.storyMode=false;
    this.mechs=[]; bullets=[]; particles=[]; dmgTexts=[];
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.select={cursor:0,idx1:-1,idx2:-1,phase:'p1',t:0,pickT:0};
    this.mapIdx=ri(0,MAPS.length-1);
    this.state='select'; sfx.ui();
  },
  startTraining(){         // 选定机体 → 与不死靶机对峙
    const S=this.select;
    this.mechs=[ new Mech(0,CHARS[S.idx1],'p1'), new Mech(1,TRAIN_DUMMY,'cpu') ];
    const d=this.mechs[1]; d.invincible=true; d.passive=true; d.isDummy=true;
    bullets=[]; particles=[]; dmgTexts=[]; resetHazards();
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.mechs[0].reset(120,1); d.reset(360,-1);
    this.timer=0; this.koWinner=null; this.round=1;
    this.state='intro'; this.introT=1.2;
    this.setAnn('训练开始 — 靶机不会死亡并持续回血',17,1.7,'#7dff9a'); sfx.round();
  },
  /* ---- 观赏模式:随机两位电脑角色自动对战 ---- */
  beginSpectate(){         // 标题进入:随机抽两位已解锁机体对峙
    this.mode=3; this.storyMode=false;
    this.mechs=[]; bullets=[]; particles=[]; dmgTexts=[];
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.select={cursor:0,idx1:-1,idx2:-1,phase:'vs',t:0,pickT:0};
    this.pickSpectators(); this.mapIdx=ri(0,MAPS.length-1);
    this.select.t=1.2; this.state='vs'; sfx.ui();
  },
  pickSpectators(){        // 从已解锁机体中随机取两位(尽量不同)
    const pool=CHARS.map((c,i)=>i).filter(charUnlocked);
    let a=pool[ri(0,pool.length-1)], b=pool[ri(0,pool.length-1)];
    if(pool.length>1) while(b===a) b=pool[ri(0,pool.length-1)];
    this.select.idx1=a; this.select.idx2=b;
  },
  nextSpectators(){        // 换两位新机体,立即展开下一场
    this.pickSpectators(); this.mapIdx=ri(0,MAPS.length-1); this.setupMatch();
    this.setAnn('新对局  '+CHARS[this.select.idx1].name+'  VS  '+CHARS[this.select.idx2].name,16,1.7,'#7df9ff');
  },
  /* ---- 故事模式 ---- */
  beginStory(){           // 标题 / 更换机师 → 选择出击机师
    this.mode=0; this.storyMode=false; this.mechs=[]; bullets=[]; particles=[]; dmgTexts=[];
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.storyPick={cursor:clamp(this.storyHero,0,CHARS.length-1)};
    this.state='storyChar';
    sfx.ui();
  },
  confirmStoryHero(i){    // 选人 → 选关:以该机师挑战全部 10 关
    if(!charUnlocked(i)){ sfx.hit(); this.setAnn('该机体尚未解锁',14,1.0,'#ff6a7a'); return; }
    this.storyHero=i;
    this.enterStorySelect();
  },
  enterStorySelect(){     // 进入选关界面(光标停在待攻关卡)
    this.storySel={cursor:clamp(storyProg.cleared,0,STORY.length-1)};
    this.mapIdx=STORY[this.storySel.cursor].map;
    this.state='story';
    sfx.ui();
  },
  enterStoryLevel(i){     // 选关 → 剧情
    if(!storyLevelOpen(i)){ sfx.hit(); this.setAnn('关卡未解锁',14,1.0,'#ff6a7a'); return; }
    this.storyIdx=i;
    this.storyScenT=0;
    this.mapIdx=STORY[i].map;
    this.state='scenario';
    sfx.ui();
  },
  startStoryFight(){      // 剧情 → 战斗(第 1 波)
    const lv=STORY[this.storyIdx];
    this.storyMode=true;
    bullets=[]; particles=[]; dmgTexts=[]; resetHazards();
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.mechs=[ new Mech(0, CHARS[this.storyHero], 'p1') ];
    this.mechs[0].reset(70,1);
    const half=Math.ceil(lv.count/2);
    // 波次结构:第 0 波 = 清剿杂兵(数量取半数),第 1 波 = Boss 单独登场。
    // 刻意不给 Boss 配护卫:实测「1 打 N」的人数劣势远大于任何数值系数,
    // 一旦 Boss 波带杂兵,高阶关卡会在数学上变成无法通关的死关。
    this.storyWaves=[ {mobs:half,boss:false}, {mobs:STORY_BOSS.bossWaveAdds,boss:true} ];
    this.storyWave=-1;
    this.spawnStoryWave();
    this.koWinner=null; this.storyWin=false;
    this.state='intro'; this.introT=1.7;
    this.setAnn(lv.title,18,1.6,'#ffe27a');
    sfx.round();
  },
  spawnStoryWave(){
    this.storyWave++;
    const w=this.storyWaves[this.storyWave];
    if(!w) return;
    // 清理上一波残骸(保留玩家)
    this.mechs=this.mechs.filter(m=>m.team===0||!m.dead);
    const lv=STORY[this.storyIdx];
    const defs=[];
    for(let i=0;i<w.mobs;i++){
      const t=lv.mobs[i%lv.mobs.length];
      defs.push({ ch:mobChar(t), mob:true, boss:false });
    }
    if(w.boss){
      defs.push({ ch:bossChar(lv, this.storyHero), mob:false, boss:true });
    }
    let nid=this.mechs.reduce((a,m)=>Math.max(a,m.id),0)+1;
    const N=defs.length;
    for(let i=0;i<N;i++){
      const d=defs[i];
      const m=new Mech(nid++, d.ch, 'cpu');
      const x=250+(N===1?100:i/(N-1)*190);   // 世界逻辑宽度仅 480,x∈[250,440]
      m.team=1; m.isMob=d.mob; m.isBoss=d.boss;
      m.reset(x,-1);
      if(d.boss) m.hp=m.maxHp=Math.round(d.ch.hp||320);
      this.mechs.push(m);
    }
    if(w.boss){
      const b=this.mechs[this.mechs.length-1];
      this.setAnn('BOSS 出现 — '+b.ch.name,20,2.0,'#ff5b5b');
      sfx.round();
    }
  },
  onStoryKill(def){
    if(def.team===0){ this.storyDefeat(); return; }
    const pl=this.mechs[0];
    if(!pl||pl.dead){ this.storyDefeat(); return; }
    if(this.enemiesOf(pl).length>0) return;
    if(this.storyWave < this.storyWaves.length-1){
      // 波间补给:纳米修复,避免连续消耗导致后续波次必败
      const heal=Math.round(pl.maxHp*WAVE_HEAL.healK);
      if(heal>0&&pl.hp<pl.maxHp){
        pl.hp=Math.min(pl.maxHp, pl.hp+heal);
        this.setAnn('波次清剿 — 纳米修复 +'+heal,15,1.4,'#7dffa0');
        sfx.ui();
      }
      this.spawnStoryWave();
    }else{
      this.storyVictory();
    }
  },
  storyVictory(){
    const idx=this.storyIdx;
    const firstClear = storyProg.cleared < idx+1;
    if(firstClear){ storyProg.cleared=idx+1; saveStory(); }
    this.storyWin=true; this.storyUnlockMsg=null;
    // 第 9 / 第 10 关的 BOSS 即隐藏机体(由 bossIdx 指定),首通即解锁
    const bossIdx = STORY[idx] ? STORY[idx].bossIdx : undefined;
    if(firstClear && bossIdx!==undefined && CHARS[bossIdx] && CHARS[bossIdx].locked)
      this.storyUnlockMsg='隐藏机体「'+CHARS[bossIdx].name+'」已解锁!可在选人界面选择使用';
    this.storyResT=0;
    this.state='sresult';
    this.setAnn('关卡达成',22,1.6,'#7df9ff');
    sfx.round();
  },
  storyDefeat(){
    this.storyWin=false; this.storyUnlockMsg=null;
    this.storyResT=0;
    this.state='sresult';
    this.setAnn('机体损毁',22,1.6,'#ff5b5b');
  },
  exitStory(){
    this.storyMode=false;
    this.mechs=[]; bullets=[]; particles=[]; dmgTexts=[];
    fireZones=[]; drones=[]; covers=[]; iceballs=[]; emorbs=[]; lightnings=[];
    this.storySel={cursor:this.storyIdx};
    this.mapIdx=STORY[this.storyIdx].map;
    this.state='story';
    sfx.ui();
  }
};

/* 动态相机:双机近→放大(1.5),远→缩小(0.75),注视点=双机中点(限界内) */
function updateCamera(dt){
  let zT=1, fx=W/2, fy=H/2;
  if(game.state==='intro'||game.state==='fight'||game.state==='ko'||game.state==='sresult'){
    // 按全部存活单位的包围盒取景(1v1 与故事模式多单位通用)
    let list=game.mechs.filter(m=>!m.dead);
    if(!list.length) list=game.mechs;
    if(list.length){
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(const m of list){
        if(m.x<x0)x0=m.x; if(m.x>x1)x1=m.x;
        if(m.y<y0)y0=m.y; if(m.y>y1)y1=m.y;
      }
      const d=Math.max(x1-x0,(y1-y0)*0.8);
      zT=clamp(1.55-d/460*0.95, ZMIN, ZMAX);   // 连续缩放,无量化阶梯
      fx=(x0+x1)/2; fy=(y0+y1)/2-24;
    }
  }
  const k=Math.min(1,dt*6);
  CAM.zoom+=(zT-CAM.zoom)*k; CAM.cx+=(fx-CAM.cx)*k; CAM.cy+=(fy-CAM.cy)*k;
  CAM.zEff=clamp(CAM.zoom,ZMIN,ZMAX);
  const hw=W/2/CAM.zEff, hh=H/2/CAM.zEff;
  CAM.cx = hw>=W/2 ? W/2 : clamp(CAM.cx,hw,W-hw);
  CAM.cy = hh>=H/2 ? H/2 : clamp(CAM.cy,hh,H-hh);
}

function updateGame(dt){
  game.t+=dt;
  if(game.ann){ game.ann.t-=dt; if(game.ann.t<=0) game.ann=null; }
  game.shake=Math.max(0,game.shake-14*dt);

  // 全局按键
  if(pressed['KeyR']&&game.state!=='title'){ game.storyMode=false; game.state='title'; sfx.ui(); }
  if((pressed['KeyP']||pressed['Escape'])&&(game.state==='fight'||game.state==='intro')){ game.pause=!game.pause; sfx.ui(); }

  switch(game.state){
    case 'title':
      if(pressed['Digit1']||pressed['Numpad1']){ game.beginFlow(0); break; }
      if(pressed['Digit2']||pressed['Numpad2']){ game.beginFlow(1); break; }
      if(pressed['Digit3']||pressed['Numpad3']){ game.beginStory(); break; }
      if(pressed['Digit4']||pressed['Numpad4']){ game.beginTraining(); break; }
      if(pressed['Digit5']||pressed['Numpad5']){ game.beginSpectate(); break; }
      break;
    case 'storyChar':{
      const S=game.storyPick, N=CHARS.length;
      if(pressed['KeyA']||pressed['ArrowLeft']) S.cursor=(S.cursor+N-1)%N;
      else if(pressed['KeyD']||pressed['ArrowRight']) S.cursor=(S.cursor+1)%N;
      else if(pressed['KeyW']||pressed['ArrowUp']||pressed['KeyS']||pressed['ArrowDown']) S.cursor=(S.cursor+7)%N;
      else if(pressed['KeyJ']||pressed['Comma']||pressed['Enter']||pressed['Space']) game.confirmStoryHero(S.cursor);
      else for(let i=0;i<9;i++) if(pressed['Digit'+(i+1)]||pressed['Numpad'+(i+1)]){ S.cursor=i; game.confirmStoryHero(i); break; }
      break;}
    case 'story':{
      const S=game.storySel, N=STORY.length, COLS=5;
      game.mapIdx=STORY[S.cursor].map;         // 背景随选中关卡切换
      if(pressed['KeyA']||pressed['ArrowLeft']) S.cursor=(S.cursor+N-1)%N;
      else if(pressed['KeyD']||pressed['ArrowRight']) S.cursor=(S.cursor+1)%N;
      else if(pressed['KeyW']||pressed['ArrowUp']||pressed['KeyS']||pressed['ArrowDown']) S.cursor=(S.cursor+COLS)%N;
      else if(pressed['KeyC']) game.beginStory();              // 返回更换出击机师
      else if(pressed['KeyJ']||pressed['Comma']||pressed['Enter']) game.enterStoryLevel(S.cursor);
      else for(let i=0;i<9;i++) if(pressed['Digit'+(i+1)]||pressed['Numpad'+(i+1)]){ S.cursor=i; game.enterStoryLevel(i); break; }
      break;}
    case 'scenario':
      game.storyScenT+=dt;
      if(game.storyScenT>0.25&&(pressed['KeyJ']||pressed['Comma']||pressed['Enter']||pressed['Space'])) game.startStoryFight();
      break;
    case 'diff':{
      let d=-1;
      if(pressed['Digit1']||pressed['Numpad1']) d=0;
      else if(pressed['Digit2']||pressed['Numpad2']) d=1;
      else if(pressed['Digit3']||pressed['Numpad3']) d=2;
      if(d>=0){ game.diffObj=DIFFS[d]; game.state='select'; sfx.ui(); }
      break;}
    case 'select':{
      const S=game.select;
      if(S.phase==='p1'){
        const N=CHARS.length;
        if(pressed['KeyA']) S.cursor=(S.cursor+N-1)%N;
        else if(pressed['KeyD']) S.cursor=(S.cursor+1)%N;
        else if(pressed['KeyW']) S.cursor=(S.cursor+N-7)%N;
        else if(pressed['KeyS']) S.cursor=(S.cursor+7)%N;
        else if(pressed['KeyJ']||pressed['Enter']) confirmSelect();
      }else if(S.phase==='p2'){
        const N=CHARS.length;
        if(pressed['ArrowLeft']) S.cursor=(S.cursor+N-1)%N;
        else if(pressed['ArrowRight']) S.cursor=(S.cursor+1)%N;
        else if(pressed['ArrowUp']) S.cursor=(S.cursor+N-7)%N;
        else if(pressed['ArrowDown']) S.cursor=(S.cursor+7)%N;
        else if(pressed['Comma']||pressed['Enter']) confirmSelect();
      }
      break;}
    case 'cpuPick':{
      const S=game.select;
      S.t-=dt; S.pickT-=dt;
      if(S.pickT<=0){ S.pickT=0.08; const pool=CHARS.map((c,i)=>i).filter(charUnlocked); S.cursor=pool[ri(0,pool.length-1)]; }   // 随机高亮滚动(仅已解锁机体)
      if(S.t<=0){ const pool=CHARS.map((c,i)=>i).filter(charUnlocked); S.idx2=pool[ri(0,pool.length-1)]; S.cursor=0; S.phase='map'; game.state='map'; sfx.ui(); }
      break;}
    case 'map':{
      const S=game.select;
      if(pressed['KeyA']||pressed['ArrowLeft']) S.cursor=(S.cursor+4)%5;
      else if(pressed['KeyD']||pressed['ArrowRight']) S.cursor=(S.cursor+1)%5;
      else if(pressed['KeyJ']||pressed['Comma']||pressed['Enter']) confirmMap();
      else{
        for(let i=0;i<5;i++)
          if(pressed['Digit'+(i+1)]||pressed['Numpad'+(i+1)]){ S.cursor=i; confirmMap(); break; }
      }
      break;}
    case 'vs':
      game.select.t-=dt;
      if(game.select.t<=0) game.setupMatch();
      break;
    case 'intro':
      game.introT-=dt;
      if(game.introT<=0.7&&game.introT+dt>0.7) game.setAnn('FIGHT!',26,0.7,'#7dff6a');
      if(game.introT<=0){ game.state='fight'; }
      for(const m of game.mechs) m.update(dt,game);
      break;
    case 'fight':
      for(const m of game.mechs) m.update(dt,game);
      // 近战判定:所有敌对配对
      for(const a of game.mechs)
        for(const d of game.mechs)
          if(a!==d && a.team!==d.team) meleeCheck(a,d);
      // 身体推挤,防止重叠(通用 N 单位两两分离)
      for(let i=0;i<game.mechs.length;i++){
        const a=game.mechs[i]; if(a.dead) continue;
        for(let j=i+1;j<game.mechs.length;j++){
          const b=game.mechs[j]; if(b.dead) continue;
          const ov=(a.size+b.size)*13-Math.abs(a.x-b.x);
          if(ov>0&&Math.abs(a.y-b.y)<32){ const s=Math.sign(a.x-b.x)||1; a.x+=s*ov/2; b.x-=s*ov/2; }
        }
      }
      updateBullets(dt,game.mechs);
      updateFireZones(dt,game.mechs);
      updateDrones(dt,game.mechs);
      updateCovers(dt,game.mechs);
      updateIceballs(dt,game.mechs);
      updateEmorbs(dt,game.mechs);
      updateLightnings(dt,game.mechs);
      if(!game.storyMode && game.mode<2){    // 训练/观赏模式不计时、不触发地图机关
        updateHazards(dt);
        game.timer-=dt;
        if(game.timer<=0){                    // 超时按血量判负
          game.timer=0;
          const [a,b]=game.mechs;
          let w=null;
          if(a.hp>b.hp) w=a; else if(b.hp>a.hp) w=b;
          game.state='ko'; game.koT=1.6; game.koWinner=w;
          game.setAnn('TIME UP',22,1.4,'#ffe27a');
          sfx.round();
        }
      }
      break;
    case 'ko':
      for(const m of game.mechs) m.update(dt,game);
      updateBullets(dt,game.mechs);
      updateFireZones(dt,game.mechs);
      updateDrones(dt,game.mechs);
      updateCovers(dt,game.mechs);
      updateIceballs(dt,game.mechs);
      updateEmorbs(dt,game.mechs);
      updateLightnings(dt,game.mechs);
      game.koT-=dt;
      if(game.koT<=0) game.endRound(game.koWinner);
      break;
    case 'sresult':
      game.storyResT+=dt;
      for(const m of game.mechs) m.update(dt,game);
      updateBullets(dt,game.mechs);
      updateFireZones(dt,game.mechs);
      updateDrones(dt,game.mechs);
      updateCovers(dt,game.mechs);
      updateIceballs(dt,game.mechs);
      updateEmorbs(dt,game.mechs);
      updateLightnings(dt,game.mechs);
      if(game.storyResT>0.8&&(pressed['KeyJ']||pressed['Comma']||pressed['Enter']||pressed['Space'])) game.exitStory();
      break;
    case 'end':
      if(game.mode===3){                       // 观赏模式:自动换人续场,或按键立即下一场
        game.spectateNextT-=dt;
        if(game.spectateNextT<=0||pressed['KeyJ']||pressed['Comma']||pressed['Enter']||pressed['Space']) game.nextSpectators();
      }
      break;
  }
  updateParticles(dt);
  updateDmgTexts(dt);
  for(const m of game.mechs) m.updateHud(dt);
  updateCamera(dt);
  pressed={};                               // 清空边沿触发
}

function text(str,x,y,size,col,align='left',base='top'){
  g.font='bold '+size+'px "Courier New",monospace';
  g.textAlign=align; g.textBaseline=base;
  g.fillStyle=col; g.fillText(str,x,y);
}
function shadowText(str,x,y,size,col,align='left'){
  text(str,x+2,y+2,size,'rgba(0,0,0,.7)',align);
  text(str,x,y,size,col,align);
}
function bar(x,y,w,h,pct,fill,fillChip,anchorRight){
  px(x-1,y-1,w+2,h+2,'#0a0c14');
  g.fillStyle='#3a4152'; g.fillRect(x,y,w,h);
  const cw=Math.round(w*clamp(pct,0,1));
  if(fillChip!==undefined){
    const chw=Math.round(w*clamp(fillChip,0,1));
    g.fillStyle='#ffe08a';
    g.fillRect(anchorRight?x+w-chw:x, y, chw, h);
  }
  g.fillStyle=fill;
  g.fillRect(anchorRight?x+w-cw:x, y, cw, h);
  px(x,y,w,1,'rgba(255,255,255,.25)');
}
function hpColor(p){ return p>0.5?'#7dff6a':(p>0.25?'#ffd94d':'#ff5b5b'); }

/* 技能行:名称贴外侧、倒计时贴内侧,同一行两端对齐;名称过长时自动截断防重叠 */
function hudSkillRow(name,timer,x0,x1,yy,col,tcol,mirror){
  g.font='bold 6.5px "Courier New",monospace';
  const tw=timer?g.measureText(timer).width+4:0;
  let s=name, nameW=(x1-x0)-tw;
  while(s.length>1 && g.measureText(s).width>nameW) s=s.slice(0,-1);
  if(mirror){
    if(timer) text(timer,x0,yy,6.5,tcol,'left');
    text(s,x1,yy,6.5,col,'right');
  }else{
    text(s,x0,yy,6.5,col,'left');
    if(timer) text(timer,x1,yy,6.5,tcol,'right');
  }
}

function drawHUD(){
  if(!game.mechs.length) return;
  const m1=game.mechs[0], m2=game.mechs[1];
  // 血条(P1 左、P2 右,白色创伤条延迟衰减)
  bar(14,9,180,10, m1.hp/m1.maxHp, hpColor(m1.hp/m1.maxHp), m1.chipHp/m1.maxHp, false);
  bar(W-194,9,180,10, m2.hp/m2.maxHp, hpColor(m2.hp/m2.maxHp), m2.chipHp/m2.maxHp, true);
  text(mechLabel(m1)+' '+m1.ch.name,14,22,9,m1.pal.light);
  text(mechLabel(m2)+' '+m2.ch.name,W-14,22,9,m2.pal.light,'right');
  // 能量条
  bar(14,33,110,4, m1.energy/100, m1.energy>=ENERGY_COST?'#5ff2ff':'#4a5a66', undefined, false);
  bar(W-124,33,110,4, m2.energy/100, m2.energy>=ENERGY_COST?'#5ff2ff':'#4a5a66', undefined, true);
  // 技能冷却:纯秒数倒计时(不画进度条,名称与倒计时分列两端,避免重叠)
  for(const [m,x0,x1,mirror] of [[m1,14,128,false],[m2,W-128,W-14,true]]){
    let yy=40;
    for(const s of m.skillSlots){
      const sk=SKILLS[s.id], cd=m.cds[s.id]||0, ready=cd<=0;

      yy+=9;

    if(m.canFly&&(m.flying||m.flyFuel<m.flyMax-0.01)){
      hudSkillRow('燃料', Math.ceil(m.flyFuel)+'%', x0,x1,yy, '#7df9ff', '#7df9ff', mirror);

  // 计时器(训练/观赏模式不计时)

    px(222,4,36,17,'#0a0c14'); px(224,6,32,13,'#141a33');
    text(String(Math.ceil(game.timer)).padStart(2,'0'),240,12,12,'#ffffff','center','middle');
  }
  // 当前地图

  // 挑战 AI:连胜计数

    for(let i=0;i<2;i++){
      const on1=m1.wins>i, on2=m2.wins>i;
      px(206-((i+1)*9),8,6,6,on1?'#ffd166':'#2a3341');
      px(266+(i*9)-6,8,6,6,on2?'#ffd166':'#2a3341');
    }
  }
  // 底部操作提示
  g.globalAlpha=0.55;
  if(game.mode===3){
    text('观赏模式 · 双方皆由电脑操控自动对战',240,H-9,7,'#7df9ff','center');
  }else if(game.mode===2){
    text('训练模式 · 靶机不会死亡并持续回血,可反复练习技能',12,H-9,7,'#8affa0');

    text('P2  ←/→ ↑跳 ↓防 ,斩 .射 · 防御+方向+,/.=技能' + (game.mode===1?'  (AI)':''),W-12,H-9,7,'#8a94b8','right');
    text('P/ESC暂停 R重开',240,H-9,7,'#5a648a','center');
  }
  g.globalAlpha=1;
}

  const t=game.storyScenT;
  shadowText(lv.title,240,30,17,'#ffe27a','center');
  const bob=Math.sin(t*2)*1.4;
  const hero=CHARS[game.storyHero];
  drawMech(fakeMech(hero,84,168+bob,1,1.5));
  text(hero.name+' · '+hero.tag,84,192,9,'#5ff2ff','center');
  for(let i=0;i<lv.intro.length;i++){
    const a=clamp((t-0.15*(i+1))/0.3,0,1);
    if(a<=0) continue;
    g.globalAlpha=a;
    text(lv.intro[i],206,80+i*21,10,'#cfd6ea','left');
    g.globalAlpha=1;
  }
  if(t>0.25&&Math.sin(T*4)>-0.3) text('按 [J] / [空格] 出击',240,H-30,10,'#7dff6a','center');
  text('R 返回标题',240,H-16,7,'#5a648a','center');
}
/* 故事模式战斗 HUD */
function drawStoryHUD(){
  const m1=game.mechs[0]; if(!m1) return;
  const lv=STORY[game.storyIdx];
  bar(14,9,180,10, m1.hp/m1.maxHp, hpColor(m1.hp/m1.maxHp), m1.chipHp/m1.maxHp, false);
  text(m1.ch.name,14,22,9,m1.pal.light);
  bar(14,33,110,4, m1.energy/100, m1.energy>=ENERGY_COST?'#5ff2ff':'#4a5a66', undefined, false);
  let yy=40;
  for(const s of m1.skillSlots){
    const sk=SKILLS[s.id], cd=m1.cds[s.id]||0, ready=cd<=0;
    const col=ready?(s.slot[1]==='J'?'#ffe27a':'#c9a6ff'):'#525d78';
    hudSkillRow(SLOT_LABELS[s.slot]+' '+sk.name, ready?'':cd.toFixed(1)+'s', 14,128, yy, col, ready?'#7dff6a':'#ff9a5b', false);
    yy+=9;
  }
  if(m1.canFly) hudSkillRow('燃料', Math.ceil(m1.flyFuel)+'%', 14,128, yy, '#7df9ff', '#7df9ff', false);
  // 顶部中央:关卡标题 + 残敌 / 波次
  text(lv.title,240,9,10,'#ffe27a','center');
  text('残敌 '+game.enemiesOf(m1).length+'   波次 '+(game.storyWave+1)+'/'+game.storyWaves.length,240,21,7.5,'#8a94b8','center');
  // BOSS 血条(顶部右侧)
  const boss=game.mechs.find(x=>x.isBoss&&!x.dead);
  if(boss){
    const bx=W-166;
    text('BOSS '+boss.ch.name,bx,9,7.5,'#ff5b5b');
    bar(bx,20,152,9, boss.hp/boss.maxHp, '#ff5b5b', boss.chipHp/boss.maxHp, true);
  }
  g.globalAlpha=0.55;
  text('P1  A/D移动 W跳 S防 J斩 K射 · 防御+方向+J/K=技能',12,H-9,7,'#8a94b8');
  g.globalAlpha=1;
}
/* 故事模式结算 */
function drawStoryResult(){
  const lv=STORY[game.storyIdx]; if(!lv) return;
  g.fillStyle='rgba(5,6,13,.68)'; g.fillRect(0,0,W,H);
  if(game.storyWin){
    shadowText('关 卡 达 成',240,86,24,'#7df9ff','center');
    shadowText(lv.title+' 完成',240,122,13,'#ffe27a','center');
    if(game.storyUnlockMsg) shadowText(game.storyUnlockMsg,240,150,12,'#ffd166','center');
  }else{
    shadowText('机 体 损 毁',240,86,24,'#ff5b5b','center');
    text(lv.title+' 挑战失败',240,122,12,'#8a94b8','center');
    text('强化操作,再来一次!',240,144,10,'#8a94b8','center');
  }
  if(game.storyResT>0.8&&Math.sin(T*4)>-0.3) text('按 [J] / [空格] 返回选关',240,184,10,'#8a94b8','center');
}
/* 选人用静态展示机体 */
function fakeMech(ch,x,y,facing,scale){
  return {id:0,ch,pal:ch.pal,facing,size:(ch.size||1)*scale,x,y,vx:0,vy:0,onGround:true,
          guarding:false,dead:false,atkT:0,walkT:0,moving:false,flash:0,muzzleT:0};
}
function drawDiff(){
  shadowText('选择难度',240,54,20,'#8df6ff','center');
  DIFFS.forEach((d,i)=>{
    const y=104+i*32;
    text('【'+(i+1)+'】 '+d.name,224,y,14,'#ffe27a','right');
    text(d.desc,256,y+3,9,'#8a94b8','left');
  });
  text('按 1/2/3 或点击选项 · [R] 返回标题',240,214,9,'#8a94b8','center');
}
function drawSelect(t){
  const S=game.select; if(!S) return;
  if(S.phase==='vs'){ // VS 过场
    if(S.idx1<0||S.idx2<0) return;
    g.fillStyle='rgba(5,6,13,.6)'; g.fillRect(0,0,W,H);
    const c1=CHARS[S.idx1], base=CHARS[S.idx2];
    const c2 = S.idx1===S.idx2
      ? Object.assign({},base,{pal:Object.assign({},base.pal,{main:base.pal.light,light:base.pal.main})}) : base;
    drawMech(fakeMech(c1,112,212,1,1.6));
    drawMech(fakeMech(c2,368,212,-1,1.6));
    text(c1.name+' ('+c1.tag+')',112,222,9,'#5ff2ff','center');
    text(c2.name+' ('+c2.tag+')',368,222,9,'#ffc24d','center');
    shadowText('VS',240,92,34,'#ff5b5b','center');
    text(game.mode===3?'观赏模式 · 电脑自动对战':(S.idx1===S.idx2?'同型机体:P2 使用 B 涂装':'准备战斗...'),240,140,10,'#8a94b8','center');
    text('战场:'+MAPS[game.mapIdx].name,240,158,9,'#ffe27a','center');
    return;
  }
  const head = S.phase==='p1' ? (game.mode===1?'选择你的机甲 — A/D 移动 W/S 换行 J 确认'
                                  : game.mode===2?'选择练习机体 — A/D 移动 W/S 换行 J 确认'
                                  :'P1 选择机甲 — A/D 移动 W/S 换行 J 确认')
             : S.phase==='p2' ? 'P2 选择机甲 — ←/→ 移动 ↑/↓ 换行 , 确认'
             : 'AI 选择中 ...';
  shadowText(head,240,19,12, S.phase==='p2'?'#ffc24d':'#5ff2ff','center');
  if(game.mode===1) text('难度:'+game.diffObj.name,240,36,8,'#8a94b8','center');
  else if(game.mode===2) text('对手是永不死去、持续回血的训练靶机',240,36,8,'#8affa0','center');
  // 7×2 机体网格(含 2 台隐藏机体,未解锁显示锁定)
  for(let i=0;i<CHARS.length;i++){
    const cx=14+(i%7)*65, cy=52+((i/7)|0)*82, cw=60, chh=74;
    const open=charUnlocked(i);
    px(cx,cy,cw,chh,open?'#0d1120':'#0a0c14');
    px(cx,cy,cw,1,'#1c2646'); px(cx,cy+chh-1,cw,1,'#1c2646');
    px(cx,cy,1,chh,'#1c2646'); px(cx+cw-1,cy,1,chh,'#1c2646');
    const showCur=(S.phase==='p1'||S.phase==='p2'||S.phase==='cpuPick')&&i===S.cursor;
    if(showCur&&Math.sin(t*6)>-0.4){           // 光标闪烁边框
      const col=S.phase==='p2'?'#ffc24d':'#5ff2ff';
      px(cx-2,cy-2,cw+4,2,col); px(cx-2,cy+chh,cw+4,2,col); px(cx-2,cy-2,2,chh+4,col); px(cx+cw,cy-2,2,chh+4,col);
    }
    if(i===S.idx1){ px(cx+3,cy+3,cw-6,1,'#5ff2ff'); px(cx+3,cy+chh-4,cw-6,1,'#5ff2ff'); text('P1',cx+6,cy+6,8,'#5ff2ff'); }
    if(i===S.idx2){ px(cx+3,cy+3,cw-6,1,'#ffc24d'); px(cx+3,cy+chh-4,cw-6,1,'#ffc24d'); text(mechLabel({id:1,ctrl:game.mode===1?'cpu':'p2'}),cx+cw-6,cy+6,8,'#ffc24d','right'); }
    g.globalAlpha=open?1:0.32;
    drawMech(fakeMech(CHARS[i],cx+30,cy+58,1,0.55));
    text(CHARS[i].name,cx+cw/2,cy+64,8,'#cfd6ea','center');
    g.globalAlpha=1;
    if(!open){
      px(cx+2,cy+2,cw-4,chh-4,'rgba(6,8,16,.55)');
      text('LOCK',cx+cw/2,cy+chh/2-8,11,'#8a94b8','center');
      text('击败第 '+CHARS[i].unlock+' 关 BOSS 解锁',cx+cw/2,cy+chh/2+4,6,'#5a648a','center');
    }
  }
  const cur=CHARS[S.cursor];
  text(cur.name+' · '+cur.tag+(charUnlocked(S.cursor)?'':'   [未解锁]'),240,218,9,'#ffe27a','center');
  text('「'+cur.lore+'」',240,230,7.5,'#8a94b8','center');
  text('HP '+cur.hp+'   攻击 x'+cur.atk+'   速度 '+cur.spd+'   体型 x'+cur.size+'   蓄能 '+cur.regen+'/s',240,242,7.5,'#8a94b8','center');
  text('武器:'+WEAPONS[cur.weapon].name+'   技能:'+skillBrief(cur)+(cur.canFly?'   双击跳可飞行':'')+(cur.airW?'   空中:'+WEAPONS[cur.airW].name:''),
       240,254,7.5,'#5ff2ff','center');
}
/* 选地图界面:4 张地图实时预览 + 随机 */
function drawMapSelect(t){
  const S=game.select; if(!S) return;
  g.fillStyle='rgba(5,6,13,.45)'; g.fillRect(0,0,W,H);
  shadowText('选择战场',240,24,18,'#ffe27a','center');
  text(CHARS[S.idx1].name,186,56,10,'#5ff2ff','right');
  text('VS',240,56,10,'#ff5b5b','center');
  text(CHARS[S.idx2].name,294,56,10,'#ffc24d','left');
  for(let i=0;i<5;i++){
    const x=18+i*92, y=96, cur=i===S.cursor;
    if(i<4){
      g.save();
      g.beginPath(); g.rect(x,y,84,48); g.clip();
      g.setTransform(SC*84/MW,0,0,SC*84/MW,x*SC,y*SC);
      MAPS[i].draw(t);
      g.restore();
    }else{
      px(x,y,84,48,'#0d1120');
      text('?',x+42,y+8,22,'#5a648a','center');
      text('随机',x+42,y+34,8,'#5a648a','center');
    }
    px(x,y,84,1,'#1c2646'); px(x,y+47,84,1,'#1c2646'); px(x,y,1,48,'#1c2646'); px(x+83,y,1,48,'#1c2646');
    if(cur&&Math.sin(t*6)>-0.4){
      px(x-2,y-2,88,2,'#ffe27a'); px(x-2,y+48,88,2,'#ffe27a'); px(x-2,y-2,2,52,'#ffe27a'); px(x+84,y-2,2,52,'#ffe27a');
    }
    text(i<4?MAPS[i].name:'随机',x+42,y+54,8,cur?'#ffe27a':'#8a94b8','center');
    text(String(i+1),x+4,y+4,7,cur?'#ffe27a':'#4a5a66');
  }
  const cur=S.cursor<4?MAPS[S.cursor]:null;
  shadowText(cur?cur.name:'随机地图',240,182,14,'#ffe27a','center');
  text(cur?cur.tag:'从 4 张地图中随机抽取一张',240,204,9,'#8a94b8','center');
  text('A/D 或 ←/→ 移动 · J / , 确认 · 也可按 1-5 或点击',240,236,8,'#5a648a','center');
}
function drawEnd(){
  g.fillStyle='rgba(5,6,13,.55)'; g.fillRect(0,0,W,H);
  const wnr=game.mechs[0].wins>=2?game.mechs[0]:game.mechs[1];
  if(game.mode===3){
    const w3=game.spectateWinner||wnr;
    shadowText('观 战 结 束',240,86,24,'#7df9ff','center');
    shadowText(mechLabel(w3)+' '+w3.ch.name+' 获胜',240,124,14,w3.pal.light,'center');
    text('即将随机换上新对手自动续战 · 按 [J] 立即下一场',240,158,9,'#8a94b8','center');
  }else if(game.mode===1){                          // 挑战 AI:走到这里只可能是玩家落败
    shadowText('CHALLENGE OVER',240,82,24,'#ff5b5b','center');
    shadowText('连胜 '+game.challengeStreak+' 场',240,118,16,'#ffe27a','center');
    text('击败你的对手:'+mechLabel(wnr)+' '+wnr.ch.name,240,146,10,wnr.pal.light,'center');
  }else{
    shadowText('VICTORY!',240,86,26,'#ffe27a','center');
    shadowText(mechLabel(wnr)+' '+wnr.ch.name+' 获得胜利',240,124,14,wnr.pal.light,'center');
  }
  if(Math.sin(T*4)>-0.3) text('按 [R] 返回标题',240,176,10,'#8a94b8','center');
}

/* ---------------- 主循环 ---------------- */
let T=0, last=0;
function render(){
  const shx=game.shake>0?ri(-game.shake,game.shake)*SC:0;
  const shy=game.shake>0?ri(-game.shake,game.shake)*SC:0;
  const z=CAM.zEff;
  const ox=SC*(W/2-CAM.cx*z)+shx, oy=SC*(H/2-CAM.cy*z)+shy;
  // 背景层:当前地图按 960×540 设计空间绘制(SC/2 × 相机缩放)
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,cv.width,cv.height);
  g.setTransform(SC*z/2,0,0,SC*z/2,ox,oy);
  drawBackground(T);
  // 世界层:逻辑坐标系 × SC × 相机缩放 —— 角色保持像素块风格
  g.setTransform(SC*z,0,0,SC*z,ox,oy);
  const list = game.state==='title' ? game.titleDuo : game.mechs;
  drawFireZones();
  drawBullets();
  drawHazards();
  for(const m of list) drawMech(m);
  for(const m of list) drawMechEffects(m);
  drawDrones();
  drawCovers();
  drawIceballs();
  drawEmorbs();
  drawLightnings();
  // 杂兵/Boss 头顶血条(世界坐标)
  if(game.storyMode){
    for(const m of game.mechs){
      if(m.dead||m.team===0) continue;
      const w=m.isBoss?46:20, h=m.isBoss?4:3;
      const x=Math.round(m.x-w/2), y=Math.round(m.y-30*m.size-(m.isBoss?14:6));
      px(x-1,y-1,w+2,h+2,'rgba(0,0,0,.6)');
      px(x,y,w,h,'#2a3140');
      px(x,y,Math.round(w*clamp(m.hp/m.maxHp,0,1)),h,m.isBoss?'#ff5b5b':'#ff9a4d');
    }
  }
  drawParticles();
  drawDmgTexts();
  // 飞行锁定标记:红色脉冲框
  if(game.state==='fight'||game.state==='ko'){
    for(const m of game.mechs){
      if(!m.flying) continue;
      const opp=game.other(m);
      if(opp&&!opp.dead&&opp.cloakT<=0){
        const x=Math.round(opp.x), y=Math.round(opp.y-20*opp.size), r=Math.round(15*opp.size+2+Math.sin(T*8)*2);
        g.strokeStyle='#ff5b5b'; g.lineWidth=1;
        const c=6;
        g.beginPath();
        g.moveTo(x-r,y-r+c); g.lineTo(x-r,y-r); g.lineTo(x-r+c,y-r);
        g.moveTo(x+r-c,y-r); g.lineTo(x+r,y-r); g.lineTo(x+r,y-r+c);
        g.moveTo(x+r,y+r-c); g.lineTo(x+r,y+r); g.lineTo(x+r-c,y+r);
        g.moveTo(x-r+c,y+r); g.lineTo(x-r,y+r); g.lineTo(x-r,y+r-c);
        g.stroke();
      }
    }
  }
  // UI 层:逻辑坐标 × SC,不随相机移动(文字按实际分辨率渲染更清晰)
  g.setTransform(SC,0,0,SC,0,0);
  if(game.state==='title'){
    drawTitle(T);
  }else if(game.state==='diff'){
    drawDiff();
  }else if(game.state==='map'){
    drawMapSelect(T);
  }else if(game.state==='select'||game.state==='cpuPick'||game.state==='vs'){
    drawSelect(T);
  }else if(game.state==='storyChar'){
    drawStoryCharSelect(T);
  }else if(game.state==='story'){
    drawStorySelect(T);
  }else if(game.state==='scenario'){
    drawScenario();
  }else{
    if(game.storyMode) drawStoryHUD();
    else drawHUD();
    drawAnnounce();
    if(game.state==='sresult') drawStoryResult();
    if(game.state==='end') drawEnd();
    if(game.pause){
      g.fillStyle='rgba(5,6,13,.72)'; g.fillRect(0,0,W,H);
      text('PAUSED',240,26,18,'#ffffff','center');
      // 双方武器与技能槽说明(压缩行距,避免内容溢出 270 逻辑高度)
      let y=48;
      for(const m of game.mechs){
        text(mechLabel(m)+' '+m.ch.name+'   武器:'+WEAPONS[m.weapon].name,240,y,8,m.pal.light,'center'); y+=12;
        for(const s of m.skillSlots){
          text(SLOT_LABELS[s.slot]+'  '+SKILLS[s.id].name+' — '+SKILLS[s.id].desc,240,y,6.5,'#8a94b8','center'); y+=9;
        }
        if(m.canFly){ text('双击跳跃键起飞,飞行中射击自动锁敌(燃料有限)',240,y,6.5,'#7df9ff','center'); y+=9; }
        if(m.ch.airW){ text('空中 下+射击:'+WEAPONS[m.ch.airW].name+(m.ch.airW==='mortar'?' — 按发射时目标位置解算抛物线,落点范围爆炸':' — 自动追踪目标'),240,y,6.5,'#c9a6ff','center'); y+=9; }
        y+=3;
      }
      text('技能:先按防御,0.5秒内输入 方向(前/后)+斩击/射击 组合出招 · ESC/P 暂停 · R 重开',240,y+4,7,'#5a648a','center');
      if(Math.sin(T*4)>-0.3) text('按 [P] 继续',240,y+18,10,'#8a94b8','center');
    }
  }
  g.setTransform(1,0,0,1,0,0);
}
function frame(ts){
  const dt=Math.min(0.033,(ts-last)/1000||0.016); last=ts;
  if(!game.pause) T+=dt;
  updateGame(game.pause?0:dt);
  render();
  requestAnimationFrame(frame);
}

/* 标题页展示机甲(静态摆设:默认两台样机) */
{
  const d1=new Mech(0,CHARS[0],'p1'); d1.reset(150,1);
  const d2=new Mech(1,CHARS[1],'p2'); d2.reset(330,-1);
  game.titleDuo=[d1,d2];
}
game.mechs=[];
loadStory();
fitCanvas();
requestAnimationFrame(frame);
</script>
